<link rel="apple-touch-icon" href="/natara/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Natara · Demo">
<meta property="og:description" content="Prueba Natara gratis: inventario, caja, ingresos y egresos para tu negocio.">

<meta property="og:url" content="https://samanat2026.github.io/natara/demo/">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Natara · Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: app shell — fixed sidebar on desktop, drawer on phone; content area scrolls. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EFED; --line:#D5DFDB;
  --ink:#13201C; --ink-2:#4A5C56; --ink-3:#7A8A84;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#D3EDE5;
  --sun:#C97A12; --sun-soft:#FBEBD2;
  --good:#1D8549; --good-soft:#DCF1E3; --warn:#A86400; --warn-soft:#FCEED3; --bad:#BF3A2F; --bad-soft:#FADFDB;
  --side:#10201B; --side-ink:#C9D9D3; --side-ink-strong:#FFFFFF; --side-hi:#1B332C;
  --f-display:'Unbounded','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(16,32,27,.05),0 6px 20px rgba(16,32,27,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141E1B; --surface-2:#1B2824; --line:#283833;
  --ink:#E3EDE9; --ink-2:#A4B5AF; --ink-3:#6F827B;
  --accent:#3CC4A2; --accent-ink:#05231B; --accent-soft:#143A30;
  --sun:#EDB257; --sun-soft:#382A13;
  --good:#4CC782; --good-soft:#163323; --warn:#F0AE48; --warn-soft:#382A0F; --bad:#F07B6F; --bad-soft:#3B1C19;
  --side:#08100E; --side-ink:#A9BDB6; --side-ink-strong:#FFFFFF; --side-hi:#16261F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141E1B; --surface-2:#1B2824; --line:#283833;
  --ink:#E3EDE9; --ink-2:#A4B5AF; --ink-3:#6F827B;
  --accent:#3CC4A2; --accent-ink:#05231B; --accent-soft:#143A30;
  --sun:#EDB257; --sun-soft:#382A13;
  --good:#4CC782; --good-soft:#163323; --warn:#F0AE48; --warn-soft:#382A0F; --bad:#F07B6F; --bad-soft:#3B1C19;
  --side:#08100E; --side-ink:#A9BDB6; --side-ink-strong:#FFFFFF; --side-hi:#16261F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
html,body{height:100%}
body{overflow:hidden}
#app{height:100%;overflow-y:auto}
#app:has(.shell){overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:100%;height:100%;overflow:hidden}
.side{height:100%}
.main{height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow-y:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:var(--side-ink-strong)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--side-ink);letter-spacing:.06em;text-transform:uppercase}
.tenant-chip{margin:0 6px 14px;padding:10px 12px;border-radius:var(--r);background:var(--side-hi)}
.tenant-chip strong{display:block;color:var(--side-ink-strong);font-size:14px}
.tenant-chip span{font-size:12px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 6px;color:var(--side-ink);opacity:.7}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--side-ink);font-weight:500}
.nav-btn:hover{background:var(--side-hi);color:var(--side-ink-strong)}
.nav-btn.on{background:var(--accent);color:var(--accent-ink)}
.nav-btn .lock{margin-left:auto;opacity:.7}
.nav-btn .count{margin-left:auto;background:var(--sun);color:#1b1206;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 6px 0;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:8px 6px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;flex:none}
.side .avatar{background:var(--side-hi);color:var(--side-ink-strong)}
.me strong{display:block;color:var(--side-ink-strong);font-size:13px}
.me span{font-size:12px}
.main{overflow-y:auto;min-width:0}
.topbar{display:none}
.scrim{display:none}
.shell > .side{grid-column:1}.shell > .main{grid-column:2;grid-row:1}
@media (max-width:880px){.shell > .main{grid-column:1}}
.page{max-width:1240px;margin:0 auto;padding-block:26px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.02em}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s ease;padding-top:max(20px,env(safe-area-inset-top,0px))}
  .shell.open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
  .shell.open .scrim{display:block}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:var(--side-ink-strong);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .topbar b{font-family:var(--f-display);font-size:17px}
  .topbar .t-sub{font-size:12px;color:var(--side-ink);margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--side)}
}
.icon-btn{border:0;background:none;color:inherit;padding:6px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:13px 18px;font-size:16px;width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.needs-dl{display:none!important}
.can-dl .needs-dl{display:inline-flex!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .sub{font-weight:500;font-size:13px;color:var(--ink-3)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g-main{grid-template-columns:1fr}}
@media (max-width:640px){.g2{grid-template-columns:1fr}}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .foot{font-size:13px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner svg{flex:none;margin-top:2px}
.banner .grow{flex:1;min-width:0}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .input{width:auto}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .input{padding-left:36px;width:100%}
.switch{position:relative;width:42px;height:24px;border-radius:20px;border:0;background:var(--line);cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--good)}
.switch.on::after{transform:translateX(18px)}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(8,16,14,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:17px}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s ease}
.toast.bad{background:var(--bad);color:#fff}
@keyframes up{from{transform:translateY(8px);opacity:0}}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.login-brand{background:var(--side);color:var(--side-ink);padding:48px max(40px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px;justify-content:center}
.login-brand .logo{display:flex;align-items:center;gap:12px;color:#fff}
.login-brand .logo b{font-family:var(--f-display);font-size:34px;letter-spacing:-.03em}
.login-brand h1{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3vw,34px);line-height:1.15;color:#fff;letter-spacing:-.02em;max-width:16ch}
.login-brand h1 em{font-style:normal;color:var(--accent)}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;max-width:460px}
.feat div{display:flex;gap:8px;align-items:center;font-size:14px}
.feat svg{color:var(--accent);flex:none}
.by{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.login-pick{padding:48px max(40px,env(safe-area-inset-right,0px)) 48px 40px;display:flex;flex-direction:column;gap:18px;justify-content:center;max-width:620px}
.login-pick h2{font-size:20px}
.acc-group{display:flex;flex-direction:column;gap:8px}
.acc-group > span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.acc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.acc:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.acc .who{flex:1;min-width:0}
.acc .who strong{display:block}
.acc .who span{font-size:13px;color:var(--ink-3)}
@media (max-width:880px){.login{grid-template-columns:1fr}.login-brand{padding:36px max(20px,env(safe-area-inset-left,0px)) 30px max(20px,env(safe-area-inset-left,0px))}.login-pick{padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));max-width:none}.feat{grid-template-columns:1fr}}

/* ---------- lock ---------- */
.lock-screen{min-height:100%;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-left,0px))}
.lock-card{max-width:460px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.lock-card .ic{width:68px;height:68px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center}
.lock-card h1{font-family:var(--f-display);font-weight:500;font-size:22px}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.pos{grid-template-columns:1fr}}
.pos-search .input{font-size:17px;padding:13px 14px 13px 42px}
.pos-search svg{left:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile strong{font-size:14px;line-height:1.25}
.tile .price{margin-top:auto;font-weight:700;font-variant-numeric:tabular-nums}
.tile .st{font-size:12px;color:var(--ink-3)}
.tile.out{opacity:.55}
.cart{position:sticky;top:16px}
.cart-items{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .nm{font-weight:600;font-size:14px}
.ci .unit{font-size:12px;color:var(--ink-3)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:30px;height:32px;cursor:pointer;font-weight:700}
.qty input{width:44px;border:0;text-align:center;background:var(--surface);height:32px;font-variant-numeric:tabular-nums}
.total-row{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.total-row .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.empty{padding:28px 10px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:8px}
.change{display:flex;justify-content:space-between;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-weight:600}
.change .num{font-size:18px}
.receipt{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:16px;border-radius:10px;line-height:1.6}
.receipt .c{text-align:center}
.receipt .ln{display:flex;justify-content:space-between;gap:10px}
.receipt hr{border:0;border-top:1px dashed var(--ink-3);margin:8px 0}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .axis{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.alt{fill:var(--sun)}
.chart .bar:hover{opacity:.8}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.hb .track{grid-column:1/-1;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hb .fill{height:100%;background:var(--accent);border-radius:6px}
.hb .fill.alt{background:var(--sun)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* modules / plan */
.mod{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mod.has{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.mod .spread strong{font-size:15px}
.mod p{margin:0;font-size:14px;color:var(--ink-2)}
.mod .foot{margin-top:auto;padding-top:6px}
.plan-card{display:flex;flex-direction:column;gap:10px}
.plan-card .price{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.plan-card ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:4px}
.msg{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.msg:last-child{border-bottom:0}
.msg .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:7px}
.msg .dot.read{background:transparent}
.msg p{margin:4px 0 0;color:var(--ink-2);font-size:14px;white-space:pre-wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.check-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.check-list{grid-template-columns:1fr}}
.check{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.check input{margin-top:3px;accent-color:var(--accent)}
.check small{display:block;color:var(--ink-3)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--ink-2)}
.money-in{position:relative}.money-in>span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}.money-in .input{padding-left:24px}
.pur-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.pur-res{grid-template-columns:1fr}}
.pur-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.pur-opt:hover{border-color:var(--accent)}
.pur-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.pur-new{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ferr{display:flex;gap:6px;align-items:center;color:var(--bad);font-size:13px;font-weight:600}
.fwarn{display:flex;gap:6px;align-items:center;color:var(--warn);font-size:13px;font-weight:600}
.input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.pass-in{position:relative}.pass-in .input{padding-right:44px}.pass-in .icon-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;gap:6px}
.rules{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-3)}
.rules li{display:flex;align-items:center;gap:4px}.rules li svg{opacity:.35}.rules li.ok{color:var(--good)}.rules li.ok svg{opacity:1}
.cases{margin:6px 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details.hint summary{cursor:pointer}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink-3);vertical-align:0}
.live.on{background:var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.feed{display:flex;flex-direction:column;max-height:430px;overflow-y:auto}
.feed-i{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.feed-i:last-child{border-bottom:0}
.feed-ic{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:12px 14px}
.hint b{color:var(--ink)}
.wa{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:14px;max-height:200px;overflow:auto}
</style>

function tenantLive(t){
 const users=S.users.filter(u=>u.tid===t.id);const now=Date.now();
 const online=users.filter(u=>now-(L0.presence[u.id]||0)<ONLINE_MS);
 const ev=L0.feed.filter(e=>e.tid===t.id);const last=ev[ev.length-1];
 const pres=Math.max(0,...users.map(u=>L0.presence[u.id]||0));
 const lastAt=Math.max(last?.at||0,pres);const lastWho=pres>(last?.at||0)?users.find(u=>L0.presence[u.id]===pres):S.users.find(u=>u.id===last?.uid);

 const salesToday=L0.feed.filter(e=>e.tid===t.id&&e.type==='venta'&&e.at>=sod(now)).map(e=>({total:e.amount||0}));
 const views=Object.entries(L0.views[t.id]||{}).sort((a,b)=>b[1]-a[1]);
 const idle=lastAt?Math.floor((now-lastAt)/DAY):999;
 return {online,lastAt,lastWho,logins7,salesToday,views,idle};
}

/* ---------- descargas (capacidad del visor) ---------- */
let DL=null;
const STANDALONE=window.self===window.top;
if(STANDALONE){DL={save:async({filename,data})=>{const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:'saved'}}};document.body.classList.add('can-dl')}
else (async()=>{for(let i=0;i<40&&!window.claude?.use;i++)await new Promise(r=>setTimeout(r,250));try{if(window.claude?.use)DL=await window.claude.use('downloads')}catch(e){}if(DL)document.body.classList.add('can-dl')})();
async function saveFile(filename,rows,sheet='Datos'){
 if(!DL||!window.XLSX){toast('La descarga no está disponible en esta vista','bad');return}
 const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);
 const arr=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 try{await DL.save({filename,data:new Blob([arr])});toast('Archivo listo')}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar el archivo','bad')}
}

   ${u.role==='cajero'&&allV?`<div class="card kpi"><span class="lbl">Mis ventas hoy</span><span class="val">${money(sum(myToday,s=>s.total))}</span><span class="foot">${myToday.length} ventas</span></div>`:`<div class="card kpi"><span class="lbl">Ticket promedio</span><span class="val">${money(tdy.length?tot/tdy.length:0)}</span><span class="foot">por venta hoy</span></div>`}

function addToCart(p,qty=1){
 if(!p)return;

 if(p.stock<want&&has('inventario'))toast(`Ojo: solo hay ${num(p.stock)} de ${p.name} en inventario`,'bad');
 if(ex)ex.qty=want;else cart.push({pid:p.id,name:p.name,price:p.price,cost:p.cost,qty});

function checkout(){

 if(!openSession()){toast('Abre la caja antes de cobrar','bad');return}
 if(pos.method==='efectivo'&&pos.received!==''&&parseMoney(pos.received)<total){toast('El dinero recibido no alcanza para el total','bad');return}
 if(pos.method==='fiado'&&!pos.customer){toast('Selecciona el cliente que se lleva fiado','bad');return}
 const t=tenant();const last=Math.max(1000,...T('sales').map(s=>s.num));
 const sale={id:uid(),tid:t.id,at:Date.now(),items:cart.map(i=>({...i})),total,method:pos.method,bank:pos.method==='transferencia'?pos.bank:'',ref:pos.method==='transferencia'?pos.ref:'',confirmed:pos.method!=='transferencia'||pos.verified,received:pos.method==='efectivo'?(parseMoney(pos.received)||total):0,seller:pos.seller,customer:pos.method==='fiado'?pos.customer:'',status:'ok',num:last+1};
 S.sales.push(sale);liveEvent('venta',`Venta #${sale.num} por ${money(total)}`,null,total);

 if(sale.method==='fiado')S.ledger.push({id:uid(),tid:t.id,cid:sale.customer,type:'cargo',amount:total,at:sale.at,note:`Venta fiada #${sale.num}`,sid:sale.id});
 save();_sc=null;

/* =========================================================
   APERTURA Y CIERRE DE CAJA
   ========================================================= */
function sessionTotals(s){
 const end=s.closedAt||Date.now();
 const sales=T('sales').filter(x=>x.status!=='anulada'&&x.at>=s.openedAt&&x.at<=end);
 const cash=sum(sales.filter(x=>x.method==='efectivo'),x=>x.total);
 const tr=sum(sales.filter(x=>x.method==='transferencia'),x=>x.total);
 const fi=sum(sales.filter(x=>x.method==='fiado'),x=>x.total);
 const mv=T('moves').filter(m=>m.method==='efectivo'&&m.at>=s.openedAt&&m.at<=end);
 const inC=sum(mv.filter(m=>m.type==='ingreso'),m=>m.amount),outC=sum(mv.filter(m=>m.type==='egreso'),m=>m.amount);
 const abonos=sum(T('ledger').filter(l=>l.type==='abono'&&l.cash&&l.at>=s.openedAt&&l.at<=end),l=>l.amount);
 return {count:sales.length,cash,tr,fi,inC:inC,outC,abonos,expected:s.base+cash+inC+abonos-outC};
}

 else{const x=sessionTotals(s);
  main=`<div class="grid g-main"><div class="card"><h2>Caja abierta <span class="sub">desde ${fdt(s.openedAt)} · ${esc(userName(s.openedBy))}</span></h2>
   <div class="tbl-wrap"><table><tbody>
   <tr><td>Base inicial</td><td class="r num">${money(s.base)}</td></tr>
   <tr><td>Ventas en efectivo (${x.count} ventas en total)</td><td class="r num">+ ${money(x.cash)}</td></tr>
   <tr><td>Ingresos en efectivo</td><td class="r num">+ ${money(x.inC)}</td></tr>
   <tr><td>Abonos de fiados en efectivo</td><td class="r num">+ ${money(x.abonos)}</td></tr>
   <tr><td>Egresos pagados con efectivo de la caja</td><td class="r num">− ${money(x.outC)}</td></tr>
   <tr><td><b>Debe haber en el cajón</b></td><td class="r num"><b style="font-size:18px">${money(x.expected)}</b></td></tr>
   </tbody></table></div>
   <div class="row muted small" style="margin-top:10px"><span>Transferencias: <b>${money(x.tr)}</b></span>·<span>Fiado: <b>${money(x.fi)}</b></span></div></div>
   <div class="card"><h2>Cerrar caja</h2><form class="stack" data-f="close-cash">${field('¿Cuánto efectivo contaste?',minp('counted','','required data-i="count-cash"'))}<div class="change"><span>Diferencia</span><span class="num" id="cash-diff">—</span></div><button class="btn primary" type="submit">Cerrar caja del día</button></form></div></div>`}
 return `<div class="page-head"><div><h1>Apertura y cierre</h1><p>Cuadra el efectivo del cajón al final de cada turno.</p></div></div>${main}
  <div class="card"><h2>Cierres anteriores</h2>${hist.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Abrió</th><th>Cerró</th><th class="r">Base</th><th class="r">Diferencia</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${fdate(h.openedAt)}</td><td>${esc(userName(h.openedBy))}</td><td>${esc(userName(h.closedBy))} · ${ftime(h.closedAt)}</td><td class="r num">${money(h.base)}</td><td class="r">${h.diff===0?'<span class="pill good">Cuadró</span>':`<span class="pill ${h.diff<0?'bad':'warn'}">${h.diff>0?'+':''}${money(h.diff)}</span>`}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted small">Todavía no hay cierres.</p>`}</div>`;
}

let importRows=[];
const COLS={kind:['tipo','clase'],unit:['unidad','medida','unidad de medida'],code:['codigo','codigo de barras','code','barcode','ean','sku','referencia'],name:['nombre','producto','descripcion','name'],cat:['categoria','category','linea','grupo'],cost:['costo','precio costo','cost','costo unitario'],price:['precio','precio venta','precio de venta','price','pvp'],stock:['stock','cantidad','existencias','inventario','unidades'],min:['minimo','stock minimo','stock_minimo','min']};
function mapRow(r){const o={};const keys=Object.keys(r);for(const f in COLS){const k=keys.find(k=>COLS[f].includes(norm(k).replace(/_/g,' '))||COLS[f].includes(norm(k)));o[f]=k!==undefined?r[k]:''}
 const n=v=>Number(String(v).replace(/[^\d.-]/g,''))||0;
 return {code:String(o.code||'').trim(),name:String(o.name||'').trim(),cat:String(o.cat||'General').trim()||'General',cost:n(o.cost),price:n(o.price),stock:n(o.stock),min:n(o.min),kind:/insumo|materia/.test(norm(o.kind))?'insumo':'venta',unit:String(o.unit||'').trim()||(/insumo|materia/.test(norm(o.kind))?'kg':'und')}}
function importModal(){

  <div id="imp-preview"></div>`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" id="imp-go" data-a="import-go" disabled>Importar</button>`,true);

async function readImport(file){
 if(!window.XLSX){toast('No se pudo cargar el lector de Excel. Revisa tu conexión.','bad');return}
 try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  const raw=XLSX.utils.sheet_to_json(ws,{defval:''});const L=has('lector');importRows=raw.map(mapRow).filter(r=>r.name&&(r.code||!L||r.kind==='insumo'));const used=new Set();importRows.forEach(r=>{if(!r.code){r.code=autoCode(used,r.kind==='insumo'?'INS':'P')}if(r.kind==='insumo')r.price=0;used.add(r.code)});
  const P=T('products');const upd=importRows.filter(r=>P.some(p=>p.code===r.code)).length;
  $('#imp-preview').innerHTML=importRows.length?`<p><b>${importRows.length}</b> productos encontrados · ${importRows.length-upd} nuevos · ${upd} para actualizar${raw.length>importRows.length?` · <span style="color:var(--warn)">${raw.length-importRows.length} filas sin código o nombre se omiten</span>`:''}</p>
   <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th class="r">Costo</th><th class="r">Precio</th><th class="r">Stock</th></tr></thead><tbody>${importRows.slice(0,8).map(r=>`<tr><td class="mono">${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.cat)}</td><td class="r num">${money(r.cost)}</td><td class="r num">${money(r.price)}</td><td class="r num">${num(r.stock)}</td></tr>`).join('')}</tbody></table></div>${importRows.length>8?`<p class="muted small">…y ${importRows.length-8} más.</p>`:''}`
   :`<div class="banner bad">${ic('alert')}<div class="grow">No encontramos filas con código y nombre. Revisa que la primera fila tenga los títulos de las columnas.</div></div>`;
  const b=$('#imp-go');if(b){b.disabled=!importRows.length;b.textContent=`Importar ${importRows.length} productos`}
 }catch(e){toast('No pudimos leer el archivo. ¿Es un Excel válido?','bad')}
}
function doImport(){
 const t=tenant();liveEvent('inventario',`Cargó ${importRows.length} productos desde Excel`);let nw=0,up=0;
 importRows.forEach(r=>{const p=S.products.find(x=>x.tid===t.id&&x.code===r.code);
  if(p){Object.assign(p,{name:r.name,cat:r.cat,cost:r.cost||p.cost,price:r.price||p.price,min:r.min||p.min});if(r.stock){p.stock+=r.stock;S.kardex.push({id:uid(),tid:t.id,pid:p.id,type:'entrada',qty:r.stock,at:Date.now(),note:'Carga desde Excel'})}up++}
  else{const np={id:uid(),tid:t.id,...r,supplier:''};S.products.push(np);S.kardex.push({id:uid(),tid:t.id,pid:np.id,type:'entrada',qty:r.stock,at:Date.now(),note:'Carga desde Excel'});nw++}});
 save();closeModal();render();toast(`${nw} productos nuevos · ${up} actualizados`);
}

function viewFinanzas(){

 const abonos=T('ledger').filter(l=>l.type==='abono'&&l.at>=from);
 const salesTot=sum(sales,s=>s.total),inM=sum(mv.filter(m=>m.type==='ingreso'),m=>m.amount)+sum(abonos,a=>a.amount),out=sum(mv.filter(m=>m.type==='egreso'),m=>m.amount);
 const inc=salesTot+inM,bal=inc-out;
 const cogs=sum(sales,s=>sum(s.items,i=>(i.cost||0)*i.qty));
 // filas: ventas agrupadas por día + movimientos
 const byDay={};sales.forEach(s=>{const k=dkey(s.at);byDay[k]=byDay[k]||{at:sod(s.at),amount:0,n:0};byDay[k].amount+=s.total;byDay[k].n++});
 let rows=[...Object.values(byDay).map(d=>({at:d.at+20*3600e3,type:'ingreso',cat:'Ventas',concept:`Ventas del día (${d.n})`,amount:d.amount,auto:true})),...mv,...abonos.map(a=>({at:a.at,type:'ingreso',cat:'Abono de fiado',concept:`${S.customers.find(c=>c.id===a.cid)?.name||''}`,amount:a.amount,auto:true}))];
 if(fin.type)rows=rows.filter(r=>r.type===fin.type);
 rows.sort((a,b)=>b.at-a.at);
 const byCat={};mv.filter(m=>m.type==='egreso').forEach(m=>byCat[m.cat]=(byCat[m.cat]||0)+m.amount);
 const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const maxC=Math.max(1,...cats.map(c=>c[1]));
 return `<div class="page-head"><div><h1>Ingresos y egresos</h1><p>Las ventas entran solas. Registra aquí los gastos y otros ingresos.</p></div>

  <div class="grid g4">
   <div class="card kpi"><span class="lbl">Ingresos</span><span class="val" style="color:var(--good)">${money(inc)}</span><span class="foot">${money(salesTot)} en ventas</span></div>
   <div class="card kpi"><span class="lbl">Egresos</span><span class="val" style="color:var(--bad)">${money(out)}</span><span class="foot">${mv.filter(m=>m.type==='egreso').length} registros</span></div>
   <div class="card kpi"><span class="lbl">Balance</span><span class="val" style="color:var(${bal>=0?'--good':'--bad'})">${money(bal)}</span><span class="foot">ingresos − egresos</span></div>
   <div class="card kpi"><span class="lbl">Utilidad bruta en ventas</span><span class="val">${money(salesTot-cogs)}</span><span class="foot">${salesTot?Math.round((salesTot-cogs)/salesTot*100):0}% de margen</span></div>

let st={days:14};
function barChart(data,{h=220,fmt=money,alt=false}={}){
 const W=720,H=h,pl=58,pr=8,pt=12,pb=28;const max=Math.max(1,...data.map(d=>d.v));
 const step=niceStep(max/4);const top=Math.ceil(max/step)*step;const iw=W-pl-pr,ih=H-pt-pb;const bw=iw/data.length;
 let g='';for(let v=0;v<=top+1e-9;v+=step){const y=pt+ih-(v/top)*ih;g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="axis" x="${pl-8}" y="${y+4}" text-anchor="end">${shortMoney(v)}</text>`}
 const every=Math.ceil(data.length/10);
 const bars=data.map((d,i)=>{const bh=(d.v/top)*ih;const x=pl+i*bw+bw*.18;return`<rect class="bar ${alt?'alt':''}" x="${x}" y="${pt+ih-bh}" width="${bw*.64}" height="${Math.max(0,bh)}" rx="3"><title>${esc(d.l)}: ${fmt(d.v)}</title></rect>${i%every===0?`<text class="axis" x="${x+bw*.32}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`:''}`}).join('');
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg></div>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function shortMoney(v){if(v>=1e6)return'$'+(v/1e6).toFixed(v%1e6?1:0).replace('.',',')+' M';if(v>=1e3)return'$'+Math.round(v/1e3)+' mil';return'$'+v}
function viewStats(){
 const days=st.days,from=sod(Date.now())-(days-1)*DAY;
 const sales=okSales().filter(s=>s.at>=from);const tot=sum(sales,s=>s.total);
 const prevFrom=from-days*DAY;const prev=sum(okSales().filter(s=>s.at>=prevFrom&&s.at<from),s=>s.total);
 const daily=[];for(let i=0;i<days;i++){const d0=from+i*DAY;daily.push({l:fshort(d0),v:sum(sales.filter(s=>s.at>=d0&&s.at<d0+DAY),s=>s.total)})}
 const prod={};sales.forEach(s=>s.items.forEach(i=>{prod[i.pid]=prod[i.pid]||{name:i.name,q:0,v:0,u:0};prod[i.pid].q+=i.qty;prod[i.pid].v+=i.qty*i.price;prod[i.pid].u+=i.qty*(i.price-(i.cost||0))}));
 const top=Object.values(prod).sort((a,b)=>b.v-a.v).slice(0,6);const maxP=Math.max(1,...top.map(p=>p.v));
 const sel_={};sales.forEach(s=>{sel_[s.seller]=sel_[s.seller]||{v:0,n:0};sel_[s.seller].v+=s.total;sel_[s.seller].n++});
 const sellers=Object.entries(sel_).sort((a,b)=>b[1].v-a[1].v);const maxS=Math.max(1,...sellers.map(s=>s[1].v));
 const meth={efectivo:0,transferencia:0,fiado:0};sales.forEach(s=>meth[s.method]+=s.total);
 const hours=Array.from({length:15},(_,i)=>({l:(6+i)+'h',v:0}));sales.forEach(s=>{const h=new Date(s.at).getHours()-6;if(hours[h])hours[h].v+=s.total});
 const util=sum(Object.values(prod),p=>p.u);
 const delta=prev?Math.round((tot-prev)/prev*100):0;
 const best=daily.reduce((a,b)=>b.v>a.v?b:a,{v:0,l:'—'});
 return `<div class="page-head"><div><h1>Estadísticas</h1><p>Cómo le está yendo a tu negocio</p></div><div class="seg">${[[7,'7 días'],[14,'14 días'],[30,'30 días']].map(([k,l])=>`<button class="${days===k?'on':''}" data-a="st-days" data-v="${k}">${l}</button>`).join('')}</div></div>
  <div class="grid g4">
   <div class="card kpi"><span class="lbl">Ventas</span><span class="val">${money(tot)}</span><span class="foot">${prev?`<span style="color:var(${delta>=0?'--good':'--bad'})">${delta>=0?'+':''}${delta}%</span> vs ${days} días anteriores`:'—'}</span></div>
   <div class="card kpi"><span class="lbl">Utilidad bruta</span><span class="val">${money(util)}</span><span class="foot">${tot?Math.round(util/tot*100):0}% de margen</span></div>
   <div class="card kpi"><span class="lbl">Número de ventas</span><span class="val">${num(sales.length)}</span><span class="foot">${money(sales.length?tot/sales.length:0)} promedio</span></div>
   <div class="card kpi"><span class="lbl">Mejor día</span><span class="val">${esc(best.l)}</span><span class="foot">${money(best.v)}</span></div>
  </div>
  <div class="card"><h2>Ventas por día</h2>${barChart(daily)}</div>
  <div class="grid g2">
   <div class="card"><h2>Productos estrella <span class="sub">por valor vendido</span></h2><div class="hbars">${top.map(p=>`<div class="hb"><span>${esc(p.name)} <span class="muted small">· ${num(p.q)} und</span></span><b class="num">${money(p.v)}</b><div class="track"><div class="fill" style="width:${p.v/maxP*100}%"></div></div></div>`).join('')||'<p class="muted small">Sin ventas</p>'}</div></div>
   <div class="card"><h2>Ventas por vendedor</h2><div class="hbars">${sellers.map(([id,s])=>`<div class="hb"><span>${esc(userName(id))} <span class="muted small">· ${s.n} ventas</span></span><b class="num">${money(s.v)}</b><div class="track"><div class="fill alt" style="width:${s.v/maxS*100}%"></div></div></div>`).join('')||'<p class="muted small">Sin ventas</p>'}</div></div>
   <div class="card"><h2>Horas con más ventas</h2>${barChart(hours,{h:200,alt:true})}</div>
   <div class="card"><h2>Métodos de pago</h2><div class="hbars">${[['Efectivo',meth.efectivo,''],['Transferencia',meth.transferencia,'alt'],['Fiado',meth.fiado,'']].filter(m=>m[0]!=='Fiado'||m[1]).map(([l,v,c])=>`<div class="hb"><span>${l} <span class="muted small">· ${tot?Math.round(v/tot*100):0}%</span></span><b class="num">${money(v)}</b><div class="track"><div class="fill ${c}" style="width:${tot?v/tot*100:0}%"></div></div></div>`).join('')}</div></div>
  </div>`;
}

function purMatches(){

 return P.filter(p=>norm(p.name).includes(q)||p.code.toLowerCase()===q||norm(p.cat).includes(q)).sort((a,b)=>(a.kind==='insumo'?0:1)-(b.kind==='insumo'?0:1)).slice(0,8);

function purResults(){
 const M=purMatches();const inList=id=>pur.items.some(i=>i.pid===id);let h='';
 if(M.length)h=`<div class="muted small" style="margin-bottom:6px">${pur.q?'Resultados':'Lo que le compras normalmente'}</div><div class="pur-res">${M.map(p=>`<button type="button" class="pur-opt ${inList(p.id)?'on':''}" data-a="pur-add" data-id="${p.id}"><span style="min-width:0"><b>${esc(p.name)}</b> ${p.kind==='insumo'?'<span class="pill">Insumo</span>':''}<span class="muted small" style="display:block">Hay ${num(p.stock)} ${esc(p.unit||'und')} · último costo ${money(p.cost)}</span></span>${ic(inList(p.id)?'check':'plus',16)}</button>`).join('')}</div>`;

 return h;

const purTotal=()=>sum(pur.items,i=>(i.qty||0)*(i.cost||0));

 <div class="total-row"><span class="muted">Total de la compra</span><span class="big" id="pur-total">${money(purTotal())}</span></div>`;

function purRefresh(which){if(which!=='items'){const r=$('#pur-results');if(r)r.innerHTML=purResults()}if(which!=='results'){const it=$('#pur-items');if(it)it.innerHTML=purItems()}}
function purAdd(p){
 let ix=pur.items.findIndex(i=>i.pid===p.id);if(ix<0){pur.items.push({pid:p.id,qty:0,cost:p.cost});ix=pur.items.length-1}
 pur.q='';const q=$('#pur-q');if(q)q.value='';purRefresh();
 setTimeout(()=>document.querySelector(`[data-i="pur-qty"][data-ix="${ix}"]`)?.focus(),20);

function purSave(){
 const t=tenant();const sp=S.suppliers.find(x=>x.id===pur.sid);const items=pur.items.filter(i=>i.qty>0);
 if(!items.length){toast('Escribe la cantidad de al menos un producto','bad');return}
 const at=Date.now();const rec=[];
 items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);p.stock=Math.round((p.stock+i.qty)*100)/100;if(i.cost)p.cost=i.cost;p.supplier=sp.id;S.kardex.push({id:uid(),tid:t.id,pid:p.id,type:'entrada',qty:i.qty,at,note:`Compra a ${sp.name}`});rec.push({pid:p.id,name:p.name,qty:i.qty,unit:p.unit||'und',cost:i.cost||0})});
 const total=sum(rec,i=>i.qty*i.cost);
 S.purchases.push({id:uid(),tid:t.id,sid:sp.id,at,items:rec,total,method:pur.method});
 S.moves.push({id:uid(),tid:t.id,type:'egreso',cat:'Compra de mercancía',concept:`Compra a ${sp.name}`,amount:total,at,method:pur.method});
 liveEvent('compra',`Compra a ${sp.name} por ${money(total)}`);save();closeModal();render();toast(`Compra de ${money(total)} registrada · ${rec.length} producto${rec.length>1?'s':''}`);
}

  <div class="grid g3">${PLANS.map(p=>`<div class="card plan-card"><div class="spread"><b style="font-size:17px">${p.name}</b><span class="pill">${S.tenants.filter(t=>t.plan===p.id).length} clientes</span></div><span class="price">${money(p.price)}<span class="muted small" style="font-weight:500"> /mes</span></span><span class="muted small">o ${money(p.price*ANNUAL_MONTHS)} al año · 2 meses gratis</span><p class="muted small" style="margin:0">${p.pitch}</p><ul>${p.mods.map(m=>`<li>${modById(m).name}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="hint">${ic('info',15)} <b>Implementación opcional:</b> ${money(SETUP.price)} por una sola vez. Incluye cargar el inventario del cliente desde su lista o fotos, configurar empleados y una capacitación de 1 hora. Los precios no incluyen IVA.</div>
  <div class="card"><h2>Cambiar precios <span class="sub">los clientes afectados reciben un aviso</span></h2>
   <form class="stack" data-f="prices" id="price-form" novalidate><div class="tbl-wrap"><table><thead><tr><th>Qué</th><th class="r">Precio actual</th><th class="r">Precio nuevo</th><th class="r">Clientes que lo pagan</th></tr></thead><tbody>
   ${[...PLANS.map(p=>['plan',p.id,`Plan ${p.name}`,p.price,'/mes']),...MODS.map(m=>['mod',m.id,`${m.name}${m.addon?' (complemento)':''}`,m.price,'/mes']),['setup','implementacion',SETUP.name,SETUP.price,' una vez']].map(([k,id,n,pr,u])=>`<tr><td><b>${esc(n)}</b>${k==='mod'?`<div class="muted small">${esc(modById(id).desc)}</div>`:''}</td><td class="r num">${money(pr)}<span class="muted small">${u}</span></td><td class="r"><div class="money-in" style="width:130px;margin-left:auto"><span>$</span><input class="input num" type="text" inputmode="numeric" autocomplete="off" data-money name="${k}:${id}" value="${grp(pr)}" aria-label="Precio nuevo de ${esc(n)}"></div></td><td class="r num">${k==='setup'?'<span class="muted small">—</span>':affected(k,id).length}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="form-grid">${field('Los precios nuevos aplican desde',inp('from',dkey(Date.now()+30*DAY),'date','required'))}<div class="field" style="justify-content:flex-end"><button class="btn primary" type="submit">Revisar cambios</button></div></div>
   <p class="muted small" style="margin:0">Te recomendamos avisar con 30 días de anticipación. Los clientes que pagan un módulo incluido en su plan no se ven afectados por el precio suelto de ese módulo.</p></form></div>
  ${pendingChanges().length?`<div class="card"><h2>Cambios programados</h2><div class="tbl-wrap"><table><thead><tr><th>Aplica desde</th><th>Qué</th><th class="r">Antes</th><th class="r">Nuevo</th><th></th></tr></thead><tbody>${pendingChanges().map(c=>`<tr><td>${fdate(c.from)}</td><td>${esc(itemName(c.kind,c.id))}</td><td class="r num">${money(c.old)}</td><td class="r num"><b>${money(c.price)}</b></td><td class="r"><button class="btn sm" data-a="price-cancel" data-id="${c.cid}">Cancelar</button></td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="card" style="max-width:720px"><h2>Envío de correos <span class="pill ${emailReady()?'good':'warn'}">${emailReady()?'Configurado':'Sin configurar'}</span></h2>
   <p class="muted small" style="margin:0 0 10px">Para que el correo de bienvenida salga solo, usamos <b>EmailJS</b> (gratis hasta 200 correos al mes). Crea una cuenta en emailjs.com, conecta tu Gmail como servicio, crea una plantilla con el texto de abajo y pega aquí los tres datos.</p>
   <form class="form-grid" data-f="emailjs">${field('Service ID',inp('service',ejs().service||'','text','placeholder="service_xxxxxxx"'))}${field('Template ID',inp('template',ejs().template||'','text','placeholder="template_xxxxxxx"'))}${field('Public Key',inp('key',ejs().key||'','text','placeholder="Tu public key"'))}<div class="field" style="justify-content:flex-end"><button class="btn primary" type="submit">Guardar</button></div></form>
   <details style="margin-top:12px"><summary class="small"><b>Texto para la plantilla de EmailJS</b></summary><p class="muted small">En el campo “To Email” de la plantilla escribe <span class="mono">{{to_email}}</span>. Las palabras entre llaves se reemplazan solas.</p><div class="wa mono">Asunto: Bienvenido a Natara: tus datos de acceso

Hola {{to_name}},

{{business}} ya tiene Natara, el sistema para manejar tu inventario, tu caja y tus cuentas.

Entra aquí: {{app_url}}
Usuario: {{login_email}}
Contraseña temporal: {{temp_password}}

La primera vez que entres te pediremos crear tu propia contraseña.

Equipo Samanat</div></details></div>
  <div class="card" style="max-width:560px"><h2>Contacto que ven los clientes suspendidos</h2><form class="row" data-f="contact"><input class="input" id="f-contact" name="contact" value="${esc(S.config.contact)}" style="flex:1;min-width:200px"><button class="btn primary" type="submit">Guardar</button></form></div>
  ${MODE==='real'?'':`<div class="card" style="max-width:560px"><h2>Datos de la demo</h2><p class="muted small" style="margin:0 0 10px">Vuelve a los datos de ejemplo. Borra las ventas, productos y clientes que hayas creado.</p><button class="btn danger" data-a="reset-ask">${ic('refresh',16)} Restablecer demo</button></div>`}`;
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
 if(a==='modal-bg'){if(e.target===el)closeModal();return}
 const H={
  'close-modal':closeModal,
  'nav-open':()=>{navOpen=true;document.querySelector('.shell')?.classList.add('open')},
  'nav-close':()=>{navOpen=false;document.querySelector('.shell')?.classList.remove('open')},
  go:()=>{sess.view=v;saveSess();if(me()?.tid)liveEvent('view',null,v);navOpen=false;closeModal();render();$('#main')?.scrollTo(0,0)},
  login:()=>{lg.mode='pick';doLogin(id)},
  'admin-create':()=>rAdminCreate(),
  'verify-resend':async()=>{try{await FB.sendEmailVerification(FB.auth.currentUser,{url:REAL_URL});toast('Te enviamos el correo de nuevo')}catch(e){toast(authErr(e),'bad')}},
  'verify-done':async()=>{const u=FB.auth.currentUser;if(!u)return;await u.reload();if(!u.emailVerified)return toast('Todavía no aparece verificado. Abre el enlace del correo y vuelve a intentarlo.','bad');await u.getIdToken(true);RB.needVerify=false;RB.authReady=false;render();fbAfterAuth(u)},
  'lg-mode':()=>{lg.mode=v;lg.err={};lg.banner=null;if(v==='forgot')lg.step=1;render();setTimeout(()=>$('#lg-email,#lg-femail')?.focus(),20)},
  'lg-restart':()=>{lg.step=1;lg.err={};lg.banner=null;render()},
  'lg-fill':()=>{const f=$('#lg-email')||$('#lg-femail');if(f){f.value=v;lg.email=v;const pw=$('#lg-pass');if(pw){pw.focus()}else f.focus()}},
  'lg-eye':()=>{const i=el.parentElement.querySelector('input');const sh=i.type==='password';i.type=sh?'text':'password';el.setAttribute('aria-label',sh?'Ocultar contraseña':'Mostrar contraseña');el.innerHTML=ic(sh?'eyeoff':'eye',18)},
  logout:()=>{if(REAL)return rLogout();const u0=me();if(u0){liveRefresh();delete L0.presence[u0.id];liveSave()}sess={uid:null,view:null};saveSess();cart=[];navOpen=false;render()},
  reset:()=>{S=seed();save();L0=seedLive();liveSave();toast('Demo restablecida');render()},
  'reset-ask':()=>openModal('Restablecer demo','<p>Se borran todos los cambios y vuelven los datos de ejemplo. Esto aplica en este navegador.</p>',`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn danger" data-a="reset-do">Restablecer</button>`),
  'reset-do':()=>{S=seed();save();L0=seedLive();liveSave();closeModal();toast('Demo restablecida');render()},
  // POS
  add:()=>{addToCart(S.products.find(p=>p.id===id));const q=$('#pos-q');if(q){q.focus()}},
  qty:()=>{const i=cart[+el.dataset.ix];i.qty=Math.max(1,i.qty+Number(el.dataset.d));refreshPOS()},
  rm:()=>{cart.splice(+el.dataset.ix,1);refreshPOS()},
  pay:()=>{pos.method=v;refreshPOS()},
  'quick-rec':()=>{pos.received=v;refreshPOS()},
  'clear-cart':()=>{cart=[];refreshPOS()},
  checkout,
  sale:()=>showReceipt(S.sales.find(s=>s.id===id)),
  'confirm-tr':()=>{const s=S.sales.find(x=>x.id===id);s.confirmed=true;save();closeModal();render();toast('Transferencia confirmada')},
  'void-ask':()=>{const s=S.sales.find(x=>x.id===id);openModal(`Anular venta #${s.num}`,`<p>El stock de los productos vuelve al inventario y la venta deja de contar en los reportes.</p>`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn danger" data-a="void-do" data-id="${id}">Anular venta</button>`)},
  'void-do':()=>{const s=S.sales.find(x=>x.id===id);s.status='anulada';s.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p){p.stock+=i.qty;S.kardex.push({id:uid(),tid:s.tid,pid:p.id,type:'entrada',qty:i.qty,at:Date.now(),note:`Anulación venta #${s.num}`})}});S.ledger=S.ledger.filter(l=>l.sid!==s.id);save();_sc=null;closeModal();render();toast('Venta anulada')},
  'export-sales':()=>saveFile(`ventas-${dkey(Date.now())}.xlsx`,T('sales').map(s=>({Numero:s.num,Fecha:new Date(s.at).toLocaleString('es-CO'),Productos:s.items.map(i=>i.qty+'x '+i.name).join(', '),Vendedor:userName(s.seller),Pago:s.method,Banco:s.bank,Referencia:s.ref,Confirmada:s.confirmed?'Sí':'No',Estado:s.status,Total:s.total})),'Ventas'),
  // inventario
  'inv-kind':()=>{inv.kind=v;inv.cat='';inv.q='';render()},
  'pur-add':()=>purAdd(S.products.find(p=>p.id===id)),
  'pur-rm':()=>{pur.items.splice(+el.dataset.ix,1);purRefresh()},
  'pur-create':()=>{const name=pur.q.trim();if(!name)return;const t=tenant();const np={id:uid(),tid:t.id,code:autoCode(null,'INS'),name:name.charAt(0).toUpperCase()+name.slice(1),cat:'Insumos',cost:0,price:0,stock:0,min:0,unit:$('#f-pur-new-unit')?.value||'kg',kind:'insumo',supplier:pur.sid};S.products.push(np);save();purAdd(np);toast(`${np.name} creado como insumo`)},
  'pur-save':purSave,
  'prod-new':()=>openModal(inv.kind==='insumo'?'Nuevo insumo':'Nuevo producto',productForm(null,inv.kind),`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" data-a="submit" data-form="prod-form">Guardar producto</button>`),
  'prod-edit':()=>{const p=S.products.find(x=>x.id===id);openModal('Editar producto',productForm(p),`<button class="btn danger" data-a="prod-del" data-id="${id}">Eliminar</button><button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" data-a="submit" data-form="prod-form">Guardar</button>`)},
  'prod-del':()=>{S.products=S.products.filter(p=>p.id!==id);save();closeModal();render();toast('Producto eliminado')},
  'stock-adj':()=>{const p=S.products.find(x=>x.id===id);const K=S.kardex.filter(k=>k.pid===id).sort((a,b)=>b.at-a.at).slice(0,6);const ins=p.kind==='insumo';const OPTS=ins?[['salida','Consumo en producción'],['entrada','Entrada'],['ajuste','Conteo físico (dejar en)']]:[['entrada','Entrada (llegó mercancía)'],['salida','Salida (daño, vencido, consumo)'],['ajuste','Conteo físico (dejar en)']];openModal(`${ins?'Registrar consumo':'Ajustar stock'} · ${p.name}`,`<p>Hay: <b>${num(p.stock)} ${esc(p.unit||'und')}</b></p><form class="stack" data-f="stock-adj" id="adj-form"><input type="hidden" name="id" value="${id}"><div class="form-grid">${field('Movimiento',sel('type',OPTS,OPTS[0][0]))}${field(`Cantidad (${esc(p.unit||'und')})`,inp('qty','','number','min="0" step="any" required'))}${field('Nota',inp('note','','text',`placeholder="${ins?'Ej: producción de la mañana':'Ej: se vencieron 3'}"`),'full')}</div></form>${K.length?`<div><b class="small">Últimos movimientos (kardex)</b><div class="tbl-wrap"><table><tbody>${K.map(k=>`<tr><td class="small">${fdt(k.at)}</td><td class="small">${esc(k.note)}</td><td class="r num">${k.type==='salida'?'−':k.type==='ajuste'?'=':'+'}${num(k.qty)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" data-a="submit" data-form="adj-form">Guardar ajuste</button>`)},
  import:importModal,
  'import-go':doImport,
  template:()=>saveFile('plantilla-inventario-natara.xlsx',[{codigo:'7701234567890',nombre:'Leche entera 1 L',categoria:'Lácteos',costo:3300,precio:4600,stock:24,minimo:10},{codigo:'PAN01',nombre:'Pan francés',categoria:'Panes',costo:350,precio:700,stock:100,minimo:30},{codigo:'',nombre:'Harina de trigo',categoria:'Harinas',costo:3200,precio:'',stock:50,minimo:20,tipo:'insumo',unidad:'kg'}],'Inventario'),
  'export-inv':()=>saveFile(`inventario-${dkey(Date.now())}.xlsx`,T('products').map(p=>({codigo:p.code,nombre:p.name,categoria:p.cat,costo:p.cost,precio:p.price,stock:p.stock,minimo:p.min,tipo:p.kind==='insumo'?'insumo':'venta',unidad:p.unit||'und'})),'Inventario'),
  // fiados
  'cust-new':()=>openModal('Nuevo cliente',`<form class="stack" data-f="cust-new" id="cust-form"><div class="form-grid">${field('Nombre',inp('name','','text','required'),'full')}${field('Teléfono',inp('phone','','tel'))}${field('Cupo máximo (opcional)',minp('limit',''))}</div></form>`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" data-a="submit" data-form="cust-form">Crear cliente</button>`),
  cust:()=>{if(e.target.closest('[data-a="abono"]'))return;custModal(S.customers.find(c=>c.id===id))},
  abono:()=>{e.stopPropagation();const c=S.customers.find(x=>x.id===id);openModal(`Abono de ${c.name}`,`<p>Saldo actual: <b>${money(balanceOf(id))}</b></p><form class="stack" data-f="abono" id="abono-form"><input type="hidden" name="cid" value="${id}"><div class="form-grid">${field('Valor del abono',minp('amount',balanceOf(id)>0?balanceOf(id):'','required'))}${field('Recibido en',sel('method',[['efectivo','Efectivo'],['transferencia','Transferencia']],'efectivo'))}</div></form>`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" data-a="submit" data-form="abono-form">Registrar abono</button>`)},
  // finanzas
  'fin-range':()=>{fin.range=v;render()},
  'move-new':()=>{const cats=v==='egreso'?EXP_CATS:INC_CATS;openModal(v==='egreso'?'Nuevo egreso':'Nuevo ingreso',`<form class="stack" data-f="move" id="move-form"><input type="hidden" name="type" value="${v}"><div class="form-grid">${field('Concepto',inp('concept','','text','required placeholder="'+(v==='egreso'?'Ej: Pago de energía':'Ej: Torta por encargo')+'"'),'full')}${field('Categoría',sel('cat',cats,cats[0]))}${field('Valor',minp('amount','','required'))}${field('Fecha',inp('date',dkey(Date.now()),'date','required'))}${field('Medio',sel('method',[['efectivo',v==='egreso'?'Efectivo de la caja':'Efectivo'],['transferencia','Transferencia']],'transferencia'))}</div></form>`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" data-a="submit" data-form="move-form">Guardar</button>`)},
  'move-del':()=>{S.moves=S.moves.filter(m=>m.id!==id);save();render();toast('Movimiento eliminado')},
  // stats
  'st-days':()=>{st.days=Number(v);render()},
  // proveedores
  'sup-new':()=>openModal('Nuevo proveedor',`<form class="stack" data-f="sup-new" id="sup-form"><div class="form-grid">${field('Nombre',inp('name','','text','required'),'full')}${field('Qué te vende',inp('what','','text','placeholder="Ej: Harina y azúcar"'),'full')}${field('Teléfono',inp('phone','','tel'))}${field('Días de visita',inp('days','','text','placeholder="Ej: Martes"'))}</div></form>`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" data-a="submit" data-form="sup-form">Guardar</button>`),
  purchase:()=>purchaseModal(S.suppliers.find(s=>s.id===id)),
  // empleados
  'emp-new':()=>openModal('Nuevo empleado',`<form class="stack" data-f="emp-new" id="emp-form" novalidate><div class="form-grid">${field('Nombre completo',inp('name','','text','required'),'full')}${field('Correo',inp('email','','email','required autocomplete="off"'))}${field('Contraseña inicial',inp('pass','','text','required autocomplete="off"'))}</div><p class="muted small" style="margin:0">La contraseña necesita al menos 8 caracteres, una mayúscula, una minúscula, un número y un símbolo. El empleado entra como cajero; después le das permisos.</p><div id="emp-err"></div></form>`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn primary" data-a="submit" data-form="emp-form">Crear empleado</button>`),
  'emp-perms':()=>permsModal(S.users.find(x=>x.id===id)),
  'emp-del-ask':()=>{const u=S.users.find(x=>x.id===id);openModal(`Eliminar a ${u.name}`,`<p style="margin:0">${esc(u.name.split(' ')[0])} ya no podrá entrar a Natara y desaparece de tu lista de empleados.</p><p class="muted small" style="margin:0">Sus ventas y cierres de caja se conservan en el historial con su nombre, para que tus cuentas no cambien. Si más adelante vuelves a crearlo con el mismo correo, se reactiva.</p>`,`<button class="btn" data-a="close-modal">Cancelar</button><button class="btn danger" data-a="emp-del" data-id="${id}">${ic('trash',16)} Eliminar empleado</button>`)},
  'emp-del':()=>{const u=S.users.find(x=>x.id===id);u.archived=true;u.active=false;u.perms=[];save();closeModal();render();toast(`${u.name} fue eliminado`)},
  'emp-reset':()=>{const u=S.users.find(x=>x.id===id);if(REAL)return rEmpReset(u);const pass=genTemp();u.pass=pass;u.mustChange=true;save();sendWelcome(tenant(),u,pass,true)},
  'emp-toggle':()=>{const u=S.users.find(x=>x.id===id);u.active=!u.active;save();render();toast(u.active?`${u.name} puede entrar de nuevo`:`${u.name} ya no puede entrar`)},
  // plan
  'req-mod':()=>{const t=tenant();if(!S.requests.some(r=>r.tid===t.id&&r.mod===v&&r.status==='pendiente')){S.requests.push({id:uid(),tid:t.id,mod:v,at:Date.now(),status:'pendiente'});save()}render();toast('Solicitud enviada a Samanat')},
  // admin
  'tenant-toggle':()=>{const t=S.tenants.find(x=>x.id===id);t.status=t.status==='activo'?'suspendido':'activo';
   S.messages.push({id:uid(),to:t.id,kind:'suspension',title:t.status==='activo'?'Tu acceso fue reactivado':'Tu acceso fue suspendido',body:t.status==='activo'?'Gracias por tu pago. Ya puedes seguir usando Natara con normalidad.':'Suspendimos el acceso por falta de pago. Tus datos siguen guardados.',at:Date.now(),readBy:[]});
   save();if(el.dataset.close)closeModal();render();toast(t.status==='activo'?`${t.name} reactivado`:`${t.name} suspendido al instante`)},
  'lector-toggle':()=>{const t=S.tenants.find(x=>x.id===id);const on=t.mods.includes('lector');t.mods=on?t.mods.filter(m=>m!=='lector'):[...t.mods,'lector'];if(!on)S.messages.push({id:uid(),to:t.id,kind:'promo',title:'Activamos el lector de código de barras',body:`Ya puedes escanear productos en la caja y el inventario. Tu cuota mensual queda en ${money(fee(t))}.`,at:Date.now(),readBy:[]});save();render();toast(on?`Lector desactivado para ${t.name}`:`Lector activado para ${t.name} (+${money(modById('lector').price)}/mes)`)},

function syncDiff(){
 if(!window.FB||!RB.user||!RB.profileReady)return;const {db,doc,writeBatch,increment}=FB;const ops=[];const seen=new Set();
 for(const c of SYNC_COLLS)for(const r of S[c]||[]){
  if(TCOLLS.includes(c)&&!r.tid)continue;const k=pathOf(c,r);seen.add(k);
  const rec=JSON.parse(JSON.stringify(r));delete rec.pass;const j=stable(rec);if(RB.synced[k]===j)continue;
  const prev=RB.synced[k]?JSON.parse(RB.synced[k]):null;
  if(c==='products'&&prev&&prev.stock!==rec.stock){const delta=Math.round((rec.stock-prev.stock)*100)/100;const rest={...rec};delete rest.stock;ops.push(b=>{b.set(doc(db,k),rest,{merge:true});b.update(doc(db,k),{stock:increment(delta)})})}

 for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(f=>f(b));b.commit().catch(e=>{console.error('sync',e);toast(e.code==='permission-denied'?'No tienes permiso para hacer ese cambio.':'No se pudo guardar en la nube. Revisa tu conexión.','bad')})}

}

async function rResend(tid){const u=S.users.find(x=>x.tid===tid&&x.role==='dueno'&&!x.archived);if(!u)return;try{await FB.sendPasswordResetEmail(FB.auth,u.email,{url:REAL_URL});closeModal();toast(`Le enviamos a ${u.email} un enlace para crear una contraseña nueva`)}catch(e){toast(authErr(e),'bad')}}
async function rPurge(tid,uids){
 const {db,collection,getDocs,writeBatch,doc,query,where}=FB;
 try{for(const c of TCOLLS){const sn=await getDocs(collection(db,'tenants',tid,c));for(let i=0;i<sn.docs.length;i+=400){const b=writeBatch(db);sn.docs.slice(i,i+400).forEach(x=>b.delete(x.ref));await b.commit()}}
  const ac=await getDocs(query(collection(db,'activity'),where('tid','==',tid)));for(let i=0;i<ac.docs.length;i+=400){const b=writeBatch(db);ac.docs.slice(i,i+400).forEach(x=>b.delete(x.ref));await b.commit()}
  const b=writeBatch(db);b.delete(doc(db,'stats',tid));uids.forEach(u=>b.delete(doc(db,'presence',u)));await b.commit();
 }catch(e){console.error('purge',e);toast('No se pudieron borrar todos los datos del cliente. Intenta de nuevo.','bad')}
}
function rLive(u,type,text,v,amount){
 const {db,doc,setDoc,addDoc,collection,increment}=FB;if(!RB.profileReady)return;
 if(type!=='view')addDoc(collection(db,'activity'),{tid:u.tid,uid:u.id,type,text:text||'',amount:amount||0,at:Date.now()}).catch(e=>console.warn('activity',e.code));
 if(v)setDoc(doc(db,'stats',u.tid),{views:{[v]:increment(1)}},{merge:true}).catch(e=>console.warn('stats',e.code));
 rBeat(u,true);
}
function rBeat(u,force){if(!RB.profileReady)return;if(!force&&Date.now()-RB.lastBeat<150000)return;RB.lastBeat=Date.now();FB.setDoc(FB.doc(FB.db,'presence',u.id),{tid:u.tid,at:Date.now()}).catch(e=>console.warn('presence',e.code))}
if(REAL){const go=()=>fbBoot();if(window.FB)go();else window.addEventListener('fb-ready',go,{once:true})}

render();
</script>
