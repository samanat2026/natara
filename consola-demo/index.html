<style>
/* Layout: app shell — fixed sidebar on desktop, drawer on phone; content area scrolls. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EFED; --line:#D5DFDB;
  --ink:#13201C; --ink-2:#4A5C56; --ink-3:#7A8A84;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#D3EDE5;
  --sun:#C97A12; --sun-soft:#FBEBD2;
  --good:#1D8549; --good-soft:#DCF1E3; --warn:#A86400; --warn-soft:#FCEED3; --bad:#BF3A2F; --bad-soft:#FADFDB;
  --side:#10201B; --side-ink:#C9D9D3; --side-ink-strong:#FFFFFF; --side-hi:#1B332C;
  --f-display:'Unbounded','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(16,32,27,.05),0 6px 20px rgba(16,32,27,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141E1B; --surface-2:#1B2824; --line:#283833;
  --ink:#E3EDE9; --ink-2:#A4B5AF; --ink-3:#6F827B;
  --accent:#3CC4A2; --accent-ink:#05231B; --accent-soft:#143A30;
  --sun:#EDB257; --sun-soft:#382A13;
  --good:#4CC782; --good-soft:#163323; --warn:#F0AE48; --warn-soft:#382A0F; --bad:#F07B6F; --bad-soft:#3B1C19;
  --side:#08100E; --side-ink:#A9BDB6; --side-ink-strong:#FFFFFF; --side-hi:#16261F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141E1B; --surface-2:#1B2824; --line:#283833;
  --ink:#E3EDE9; --ink-2:#A4B5AF; --ink-3:#6F827B;
  --accent:#3CC4A2; --accent-ink:#05231B; --accent-soft:#143A30;
  --sun:#EDB257; --sun-soft:#382A13;
  --good:#4CC782; --good-soft:#163323; --warn:#F0AE48; --warn-soft:#382A0F; --bad:#F07B6F; --bad-soft:#3B1C19;
  --side:#08100E; --side-ink:#A9BDB6; --side-ink-strong:#FFFFFF; --side-hi:#16261F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
html,body{height:100%}
body{overflow:hidden}
#app{height:100%;overflow-y:auto}
#app:has(.shell){overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:100%;height:100%;overflow:hidden}
.side{height:100%}
.main{height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow-y:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:var(--side-ink-strong)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--side-ink);letter-spacing:.06em;text-transform:uppercase}
.tenant-chip{margin:0 6px 14px;padding:10px 12px;border-radius:var(--r);background:var(--side-hi)}
.tenant-chip strong{display:block;color:var(--side-ink-strong);font-size:14px}
.tenant-chip span{font-size:12px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 6px;color:var(--side-ink);opacity:.7}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--side-ink);font-weight:500}
.nav-btn:hover{background:var(--side-hi);color:var(--side-ink-strong)}
.nav-btn.on{background:var(--accent);color:var(--accent-ink)}
.nav-btn .lock{margin-left:auto;opacity:.7}
.nav-btn .count{margin-left:auto;background:var(--sun);color:#1b1206;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 6px 0;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:8px 6px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;flex:none}
.side .avatar{background:var(--side-hi);color:var(--side-ink-strong)}
.me strong{display:block;color:var(--side-ink-strong);font-size:13px}
.me span{font-size:12px}
.main{overflow-y:auto;min-width:0}
.topbar{display:none}
.scrim{display:none}
.shell > .side{grid-column:1}.shell > .main{grid-column:2;grid-row:1}
@media (max-width:880px){.shell > .main{grid-column:1}}
.page{max-width:1240px;margin:0 auto;padding-block:26px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.02em}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s ease;padding-top:max(20px,env(safe-area-inset-top,0px))}
  .shell.open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
  .shell.open .scrim{display:block}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--side);color:var(--side-ink-strong);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .topbar b{font-family:var(--f-display);font-size:17px}
  .topbar .t-sub{font-size:12px;color:var(--side-ink);margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--side)}
}
.icon-btn{border:0;background:none;color:inherit;padding:6px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:13px 18px;font-size:16px;width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.needs-dl{display:none!important}
.can-dl .needs-dl{display:inline-flex!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .sub{font-weight:500;font-size:13px;color:var(--ink-3)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g-main{grid-template-columns:1fr}}
@media (max-width:640px){.g2{grid-template-columns:1fr}}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .foot{font-size:13px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner svg{flex:none;margin-top:2px}
.banner .grow{flex:1;min-width:0}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .input{width:auto}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .input{padding-left:36px;width:100%}
.switch{position:relative;width:42px;height:24px;border-radius:20px;border:0;background:var(--line);cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--good)}
.switch.on::after{transform:translateX(18px)}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(8,16,14,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:17px}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s ease}
.toast.bad{background:var(--bad);color:#fff}
@keyframes up{from{transform:translateY(8px);opacity:0}}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.login-brand{background:var(--side);color:var(--side-ink);padding:48px max(40px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px;justify-content:center}
.login-brand .logo{display:flex;align-items:center;gap:12px;color:#fff}
.login-brand .logo b{font-family:var(--f-display);font-size:34px;letter-spacing:-.03em}
.login-brand h1{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3vw,34px);line-height:1.15;color:#fff;letter-spacing:-.02em;max-width:16ch}
.login-brand h1 em{font-style:normal;color:var(--accent)}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;max-width:460px}
.feat div{display:flex;gap:8px;align-items:center;font-size:14px}
.feat svg{color:var(--accent);flex:none}
.by{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.login-pick{padding:48px max(40px,env(safe-area-inset-right,0px)) 48px 40px;display:flex;flex-direction:column;gap:18px;justify-content:center;max-width:620px}
.login-pick h2{font-size:20px}
.acc-group{display:flex;flex-direction:column;gap:8px}
.plan-demo{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.plan-demo.susp{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,var(--line))}
.pd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pd-head > div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.pd-head strong{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em}
.pd-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.pd-price{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.pd-price b{font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.pd-price{align-items:flex-start;text-align:left}}
.cta-login{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--side);color:var(--side-ink);text-decoration:none;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 18%,transparent);transition:transform .15s,box-shadow .15s}
.cta-login:hover{transform:translateY(-1px);box-shadow:0 12px 34px color-mix(in srgb,var(--accent) 28%,transparent)}
.cta-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.cta-txt small{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700}
.cta-txt b{font-family:var(--f-display);font-weight:500;font-size:20px;color:#fff;letter-spacing:-.01em;line-height:1.2}
.cta-txt span{font-size:13.5px}
.cta-go{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 16px;border-radius:10px;white-space:nowrap}
@media (max-width:560px){.cta-login{grid-template-columns:auto minmax(0,1fr)}.cta-go{grid-column:1/-1;justify-content:center}}
.cta-buy{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:14px;border:1px dashed var(--accent);background:var(--accent-soft)}
.cta-buy b{font-size:16px}.cta-buy span{font-size:14px;color:var(--ink-2)}.cta-buy .mono{color:var(--accent);font-weight:600;user-select:all}
.pay-qr{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.pay-qr img{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:8px;padding:6px;flex:none}
.pay-qr div{display:flex;flex-direction:column;gap:4px}
@media (max-width:480px){.pay-qr{flex-direction:column;text-align:center}.pay-qr img{width:200px;height:200px}}
.pay-box{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pay-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pay-row:last-child{border-bottom:0}
.pay-row span{color:var(--ink-3);font-size:13px;min-width:130px}
.pay-row b{font-size:16px}.pay-row .btn{margin-left:auto}
.pay-row.big{background:var(--accent-soft)}.pay-row.big b{font-size:24px;font-variant-numeric:tabular-nums}
.co-plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.co-plans{grid-template-columns:1fr}}
.co-plan{display:flex;flex-direction:column;gap:4px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.co-plan.on{border-color:var(--accent);background:var(--accent-soft)}
.co-price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.co-price small{font-size:12px;font-weight:500;color:var(--ink-3)}
.co-extras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
@media (max-width:620px){.co-extras{grid-template-columns:1fr}}
.co-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.co-total b{font-size:24px;font-variant-numeric:tabular-nums}
.guide-toc{display:flex;flex-wrap:wrap;gap:8px}
.guide-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600}

 try{history.pushState({...(history.state||{}),scan:1},'')}catch(_){}
 const video=$('#scan-video');const msg=t=>{const m=$('#scan-msg');if(m)m.textContent=t};
 try{
  scan.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  if(!scan.on){scanStopStream();return}
  video.srcObject=scan.stream;await video.play().catch(()=>{});
  const tr=scan.stream.getVideoTracks()[0];const caps=tr&&tr.getCapabilities?tr.getCapabilities():{};
  if(caps.torch){const b=$('#scan-torch');if(b)b.hidden=false}
  if(caps.focusMode&&caps.focusMode.includes('continuous'))tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  msg('Pon el código dentro del recuadro');
  scan.det=await nativeDetector();
  if(!scan.det){
   msg('Cargando el lector…');
   const Z=await loadZXing();if(!scan.on)return;
   const hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.QR_CODE]);
   scan.zx=new Z.BrowserMultiFormatReader(hints);
   msg('Pon el código dentro del recuadro');
  }
  // un solo ciclo para los dos motores: lee el cuadro actual del video cada ~150 ms
  const loop=async()=>{if(!scan.on)return;
   if(!scan.busy&&video.readyState>=2){scan.busy=true;
    try{if(scan.det){const r=await scan.det.detect(video);if(r&&r.length)scanHit(r[0].rawValue)}else if(scan.zx){const r=scan.zx.decode(video);if(r)scanHit(r.getText())}}catch(_){}
    scan.busy=false}
   scan.timer=setTimeout(loop,scan.det?120:160)};
  loop();
 }catch(err){
  const n=err&&err.name;
  scanClose(true);
  toast(n==='NotAllowedError'||n==='SecurityError'?'Natara no tiene permiso para usar la cámara. Actívalo en el candado de la barra de direcciones.':n==='NotFoundError'||n==='OverconstrainedError'?'No encontramos una cámara en este equipo. Usa el lector USB o escribe el código.':err&&err.message==='zxing'?'No se pudo cargar el lector. Revisa tu conexión a internet.':'No se pudo abrir la cámara. Intenta de nuevo.','bad');
 }
}
function scanStopStream(){try{scan.stream&&scan.stream.getTracks().forEach(t=>t.stop())}catch(_){}scan.stream=null}
function scanClose(fromBack){
 if(!scan.on&&!$('#scan-root'))return;
 scan.on=false;clearTimeout(scan.timer);scan.zx=null;scan.busy=false;scan.det=null;scanStopStream();
 $('#scan-root')?.remove();
 if(!fromBack&&history.state&&history.state.scan){scanSkipPop=true;try{history.back()}catch(_){scanSkipPop=false}}
 const t=scan.target;scan.target=null;
 if(t==='pos'){$('#pos-results')&&($('#pos-results').innerHTML=posResults())}
}
let scanSkipPop=false;
function scanFlash(ok,html){const f=$('#scan-frame');if(f){f.classList.remove('ok','bad');void f.offsetWidth;f.classList.add(ok?'ok':'bad');setTimeout(()=>f.classList.remove('ok','bad'),600)}const l=$('#scan-last');if(l&&html)l.innerHTML=html}
function findByCode(code){const c=String(code).trim();if(!c)return null;const P=T('products');
 return P.find(p=>p.code===c)||P.find(p=>String(p.code).toLowerCase()===c.toLowerCase())
  // EAN-13 que empieza en 0 = UPC-A: se acepta con o sin el cero
  ||(c.length===13&&c[0]==='0'?P.find(p=>p.code===c.slice(1)):c.length===12?P.find(p=>p.code==='0'+c):null)||null}
function scanHit(raw){
 const code=String(raw||'').trim();if(!code)return;const now=Date.now();
 // mientras el mismo código siga frente a la cámara no se vuelve a sumar; para sumar otro igual, retira el producto y vuelve a apuntar
 if(code===scan.last&&now-scan.lastAt<1200){scan.lastAt=now;return}
 scan.last=code;scan.lastAt=now;
 const t=scan.target;
 if(t==='code'){scanBeep();const i=$('#prod-form [name=code]');if(i){i.value=code;i.dispatchEvent(new Event('input',{bubbles:true}))}scanClose();toast(`Código ${code} listo`);const n=$('#prod-form [name=name]');if(n&&!n.value)setTimeout(()=>n.focus(),40);return}
 if(t==='inv'){scanBeep();scanClose();applyCode(code,'inv');return}
 const ok=applyCode(code,t);
 if(ok){scan.n++;scanBeep(true);scanFlash(true,`<span class="pill good">${ic('check',14)} ${scan.n}</span><span class="grow"><b>${esc(ok.name)}</b>${ok.extra?` · ${esc(ok.extra)}`:''}</span>`)}
 else{scanBeep(false);const mk=canDo('inv_edit')&&has('inventario');scanFlash(false,`<span class="pill bad">${ic('alert',14)}</span><span class="grow">No encontramos el código <b class="mono">${esc(code)}</b>.</span>${mk?`<button class="btn sm" data-a="scan-newprod" data-v="${esc(code)}">${ic('plus',14)} Crearlo</button>`:''}`)}
}
// Lleva un código (de la cámara o del lector USB) a la pantalla donde está la persona
function applyCode(code,where){
 const p=findByCode(code);
 if(where==='pos'){if(!p||p.kind==='insumo')return null;addToCart(p);const it=cart.find(i=>i.pid===p.id);return{name:p.name,extra:`${num(it?.qty||1)} en la venta · ${money(p.price)}`}}
 if(where==='mz'){if(!p||p.kind==='insumo'||!mz.id)return null;mzAdd(p.id);return{name:p.name,extra:money(p.price)}}
 if(where==='pur'){if(!p)return null;purAdd(p);return{name:p.name,extra:'escribe cantidad y costo'}}
 if(where==='inv'){inv.q=code;if(p){inv.kind=p.kind==='insumo'?'insumo':'venta'}render();if(p&&isOwner())setTimeout(()=>H_stock(p.id),30);else if(!p)toast(`No encontramos el código ${code}`,'bad');return p}
 return null;
}
// Lector USB/Bluetooth (modo teclado): llega como teclas muy seguidas que terminan en Enter
const wedge={buf:'',t0:0,last:0};
function wedgeWhere(){
 if(!has('lector')||scan.on)return null;
 const mo=$('#modal-root').innerHTML;
 if(mo){if($('#pur-q'))return 'pur';return null}
 if(sess.view==='caja')return 'pos';
 if(sess.view==='mesas'&&mz.id&&!mz.pay)return 'mz';
 if(sess.view==='inventario')return 'inv';
 return null;
}
document.addEventListener('keydown',e=>{
 const tg=e.target,typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
 if(typing)return; // si hay un campo con el foco, el lector escribe ahí y el Enter de ese campo hace el resto
 const now=Date.now();
 if(e.key==='Enter'){
  const b=wedge.buf,fast=b.length>=4&&(wedge.last-wedge.t0)/(b.length-1||1)<45&&now-wedge.last<120;wedge.buf='';
  if(!fast)return;const w=wedgeWhere();if(!w)return;e.preventDefault();
  if(w==='inv'){applyCode(b,'inv');return}
  const ok=applyCode(b,w);if(ok)scanBeep(true);else{scanBeep(false);toast(`No encontramos el código ${b}`,'bad')}
  return;
 }
 if(e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey)return;
 if(now-wedge.last>80)wedge.buf='',wedge.t0=now;
 wedge.buf+=e.key;wedge.last=now;
},true);
window.addEventListener('popstate',e=>{if(scanSkipPop){scanSkipPop=false;e.stopImmediatePropagation();return}if(scan.on){e.stopImmediatePropagation();scanClose(true)}},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scan.on)scanClose()});

/* =========================================================
   MESAS Y MESEROS (restaurantes, cafeterías)
   tables: las mesas del negocio (las crea el dueño)
   tabs: la cuenta abierta de una mesa · tablines: cada producto pedido (qty y paid)
   Cada producto es un documento aparte, así el mesero agrega mientras la caja cobra.
   ========================================================= */
const FOOD_RE=/restaur|cafeter|comida|asadero|pizz|\bbar\b|gastro|corrientazo|cevich|hambur|parrill|marisq|cocina|panader/;
const foodType=t=>!!t&&FOOD_RE.test(norm(t.type));
const isMesero=u=>!!u&&u.role==='cajero'&&u.puesto==='mesero';
const roleLabel=u=>u.role==='superadmin'?'Superadmin':u.role==='dueno'?'Dueño(a)':isMesero(u)?'Mesero(a)':'Cajero(a)';
const mesasOf=()=>T('tables').sort((a,b)=>(a.order??0)-(b.order??0)||a.name.localeCompare(b.name,'es',{numeric:true}));
const tabOf=tbId=>T('tabs').find(x=>x.table===tbId&&x.open);
const linesOf=tabId=>T('tablines').filter(l=>l.tab===tabId&&l.qty>0).sort((a,b)=>a.at-b.at);
const pendQty=l=>Math.max(0,l.qty-(l.paid||0));
const tabPend=tabId=>sum(linesOf(tabId),l=>pendQty(l)*l.price);
const tabPaid=tabId=>sum(linesOf(tabId),l=>(l.paid||0)*l.price);

const canCobrar=()=>has('caja')&&(!isMesero(me())||meseroCobra(me()));
const mzLong=t=>{const m=Math.max(1,Math.round((Date.now()-t)/6e4));return m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?' '+(m%60)+' min':''}`};
let mz={id:null,pay:false,sel:{},q:'',cat:'',bak:null};

function viewMesas(){

 const own=isOwner();
 const occ=M.filter(m=>tabOf(m.id));const pend=sum(occ,m=>tabPend(tabOf(m.id).id));const bills=occ.filter(m=>tabOf(m.id).bill);

 if(!M.length)return head+(own?`<div class="card" style="max-width:560px"><form class="stack" data-f="mz-create" id="mz-create"><h2 style="margin:0">¿Cuántas mesas tiene tu negocio?</h2><p class="muted small" style="margin:0">Las creamos como Mesa 1, Mesa 2… Después les puedes cambiar el nombre (por ejemplo Terraza 1 o Barra) y agregar o quitar mesas cuando quieras.</p>${field('Número de mesas',inp('count','10','number','min="1" max="200" required inputmode="numeric"'))}<button class="btn primary" style="align-self:flex-start">${ic('plus',16)} Crear mesas</button></form></div>`:`<div class="card empty">${ic('table',28)}El dueño todavía no ha creado las mesas del negocio.</div>`);
 const card=m=>{const t=tabOf(m.id);const st=!t?'libre':t.bill?'cuenta':'ocupada';if(!t)return`<button class="mesa libre" data-a="mz-open" data-id="${m.id}"><span class="mesa-top"><b>${esc(m.name)}</b></span><span class="mesa-free">Libre</span></button>`;

function mzProducts(){const P=T('products').filter(p=>p.kind!=='insumo');const q=norm(mz.q);

 if(ex)ex.qty++;else S.tablines.push({id:uid(),tid:t.tid,tab:t.id,pid:p.id,name:p.name,price:p.price,cost:effCost(p),qty:1,paid:0,by:me().id,at:Date.now(),open:true});

function mzApplyPay(sale){
 const t=S.tabs.find(x=>x.id===pos.tab);if(!t)return null;const m=S.tables.find(x=>x.id===t.table);
 sale.tab=t.id;sale.mesa=m?.name||'';
 sale.items.forEach(i=>{const l=S.tablines.find(x=>x.id===i.line);if(l)l.paid=(l.paid||0)+Math.min(i.qty,pendQty(l))});
 sale.mesaN=S.sales.filter(x=>x.tab===t.id&&x.status!=='anulada').length+1;sale.mesaRest=tabPend(t.id);
 const left=linesOf(t.id).some(l=>pendQty(l)>0);t.bill=false;
 if(!left)mzCloseTab(t);
 return {closed:!left,name:sale.mesa};
}

function mzVoid(s){
 if(!s.tab)return;const its=s.items.filter(i=>i.line);if(!its.length)return;let t=S.tabs.find(x=>x.id===s.tab);if(!t)return;
 if(!t.open){const cur=S.tabs.find(x=>x.tid===s.tid&&x.table===t.table&&x.open);if(cur){its.forEach(i=>{const l=S.tablines.find(x=>x.id===i.line);if(l)l.tab=cur.id});t=cur}else{t.open=true;t.closedAt=null}}
 its.forEach(i=>{const l=S.tablines.find(x=>x.id===i.line);if(l)l.paid=Math.max(0,(l.paid||0)-i.qty)});
 S.tablines.filter(l=>l.tab===t.id).forEach(l=>l.open=true);
}

/* =========================================================
   BOTÓN ATRÁS (celular y navegador)
   Cada pantalla queda en el historial: Atrás vuelve a la anterior en vez de cerrar la app.
   Con una ventana o el menú abiertos, Atrás solo los cierra. Nunca vuelve a la sesión de otro usuario.
   ========================================================= */
let navRestoring=false;
const navKey=()=>({nt:1,u:sess.uid||null,v:sess.view||null,m:mz.id||null,p:!!mz.pay});
const navSame=(a,b)=>!!a&&!!b&&a.u===b.u&&a.v===b.v&&a.m===b.m&&a.p===b.p;
function navTrack(){if(navRestoring)return;try{const h=history.state&&history.state.nt?history.state:null;const k=navKey();if(!h)history.replaceState(k,'');else if(!navSame(h,k))history.pushState(k,'')}catch(e){}}
window.addEventListener('popstate',e=>{
 const s=e.state;if(!s||!s.nt)return;
 const keep=()=>{try{history.pushState(navKey(),'')}catch(_){}};
 // primero se cierra lo que esté encima: una ventana o el menú del celular
 if($('#modal-root').innerHTML){closeModal();keep();return}
 if(navOpen){navOpen=false;document.querySelector('.shell')?.classList.remove('open');keep();return}
 // otra sesión (alguien cerró sesión o entró otro usuario): no se vuelve a ella
 if(s.u!==(sess.uid||null)){try{history.replaceState(navKey(),'')}catch(_){}return}
 navRestoring=true;
 try{
  if(mz.pay&&!(s.p&&s.m===mz.id))mzPayExit(true);
  sess.view=s.v;saveSess();mz.id=s.m;mz.q='';mz.cat='';
  if(s.p&&s.m&&tabOf(s.m)&&canCobrar()){mz.pay=false;mzPayStart()}else render();
  $('#main')?.scrollTo(0,0);
 }finally{navRestoring=false}
 try{history.replaceState(navKey(),'')}catch(_){}
});

/* =========================================================
   PUNTOS Y FIDELIZACIÓN (módulo 'fidelizacion')
   El dueño paga el módulo; para el cliente final afiliarse es gratis.
   Cada cliente guarda sus puntos en lotes {p: puntos, v: vence (ms)}:
   al usar puntos se gastan primero los que vencen antes.
   ========================================================= */
const FID_DEF={montoPorPunto:1000,valorPunto:7,minimoRedimir:100,mesesVigencia:12,bienvenida:0};
function fidCfg(){const t=tenant();const r=t&&S.settings.find(x=>x.id==='fid_'+t.id);return {...FID_DEF,...(r||{})}}
// El módulo puede estar en el plan y aun así apagado: arranca apagado y el dueño lo enciende cuando quiera.
// (Los negocios que ya lo usaban antes de este cambio, con configuración o afiliados, siguen encendidos.)
function fidOn(){if(!has('fidelizacion'))return false;const t=tenant();const r=S.settings.find(x=>x.id==='fid_'+t.id);if(r&&typeof r.on==='boolean')return r.on;return !!r||T('members').length>0}
function setFid(on){const t=tenant();const id='fid_'+t.id;const r=S.settings.find(x=>x.id===id);if(r)r.on=on;else S.settings.push({id,tid:t.id,on});if(!on){pos.mid='';pos.fdoc='';pos.useP=false}save();render()}
const docDigits=v=>String(v||'').replace(/\D/g,'');
const memberByDoc=d=>T('members').find(m=>m.doc===docDigits(d));
const lotesVig=m=>(m.lotes||[]).filter(l=>l.v>Date.now()&&l.p>0).sort((a,b)=>a.v-b.v);
const ptsOf=m=>sum(lotesVig(m),l=>l.p);
const ptsSoon=m=>sum(lotesVig(m).filter(l=>l.v<Date.now()+30*DAY),l=>l.p);
const earnPts=(paid,cfg)=>Math.floor(Math.max(0,paid)/cfg.montoPorPunto);
const addMonths=(ms,n)=>{const d=new Date(ms);d.setMonth(d.getMonth()+n);return d.getTime()};
function ptsConsume(m,q){let r=q;m.lotes=lotesVig(m).map(l=>{const x=Math.min(l.p,r);r-=x;return {...l,p:l.p-x}}).filter(l=>l.p>0)}
function ptsMove(m,type,pts,note,sid){S.pmoves.push({id:uid(),tid:m.tid,mid:m.id,type,pts,note,sid:sid||'',at:Date.now(),by:me()?.id||''})}
// Puntos que se pueden usar en una compra: todos los disponibles, sin pasarse del total
function maxRedeem(m,total,cfg){const p=ptsOf(m);if(p<cfg.minimoRedimir)return 0;return Math.min(p,Math.floor(total/cfg.valorPunto))}
function fidDisc(total){if(!fidOn()||!pos.mid||!pos.useP)return 0;const m=T('members').find(x=>x.id===pos.mid);if(!m)return 0;const cfg=fidCfg();return maxRedeem(m,total,cfg)*cfg.valorPunto}
function fidFind(){
 const inp_=$('#fid-doc');if(inp_)pos.fdoc=inp_.value;const dc=docDigits(pos.fdoc);
 if(dc.length<5){toast('Escribe la cédula completa del cliente','bad');return}
 const m=memberByDoc(dc);pos.fdoc=dc;
 if(m){pos.mid=m.id;pos.fmiss=false;pos.useP=false}else{pos.mid='';pos.fmiss=true}
 refreshPOS();
}
function fidBox(total){
 if(!fidOn())return '';
 const cfg=fidCfg();const m=pos.mid&&T('members').find(x=>x.id===pos.mid);
 if(m){const p=ptsOf(m);const mx=maxRedeem(m,total,cfg);const disc=pos.useP?mx*cfg.valorPunto:0;const gana=pos.method==='fiado'?0:earnPts(total-disc,cfg);
  return `<div class="fid on"><div class="spread"><span class="row" style="gap:8px">${ic('gift',16)}<b>${esc(m.name)}</b></span><button class="btn ghost sm" data-a="fid-clear">Quitar</button></div>
   <div class="muted small" style="margin:2px 0 6px">C.C. ${esc(m.doc)} · <b>${num(p)} puntos</b> = ${money(p*cfg.valorPunto)}${ptsSoon(m)?` · <span style="color:var(--warn)">${num(ptsSoon(m))} vencen pronto</span>`:''}</div>
   ${mx>0?`<label class="check"><input type="checkbox" data-c="fid-use" ${pos.useP?'checked':''}><span>Usar ${num(mx)} puntos<small>Descuenta ${money(mx*cfg.valorPunto)} de esta venta.</small></span></label>`:p>0?`<div class="muted small">Podrá usar sus puntos cuando tenga ${num(cfg.minimoRedimir)}.</div>`:''}
   ${total?`<div class="small" style="margin-top:4px">${pos.method==='fiado'?'Las ventas fiadas no suman puntos.':`Con esta compra gana <b>${num(gana)}</b> punto${gana===1?'':'s'}.`}</div>`:''}</div>`}
 return `<div class="fid"><div class="row" style="gap:8px;flex-wrap:nowrap">${ic('gift',16)}<input class="input" id="fid-doc" inputmode="numeric" placeholder="Cédula para puntos" value="${esc(pos.fdoc)}" data-i="fid-doc" autocomplete="off"><button class="btn sm" data-a="fid-find">Buscar</button></div>${pos.fmiss?`<div class="small" id="fid-miss" style="margin-top:6px">Esa cédula no está afiliada. <button type="button" class="linkish" data-a="fid-new">Afiliarlo ahora (gratis)</button></div>`:''}</div>`;
}
function fidVoid(s){
 if(!s.mid)return;const m=S.members.find(x=>x.id===s.mid);if(!m)return;const cfg=fidCfg();
 if(s.ptsEarned){let rest=s.ptsEarned;const l=(m.lotes||[]).find(x=>x.sid===s.id);if(l){const q=Math.min(l.p,rest);l.p-=q;rest-=q}m.lotes=lotesVig(m);if(rest>0)ptsConsume(m,Math.min(rest,ptsOf(m)));ptsMove(m,'anula',-s.ptsEarned,`Anulación venta #${s.num}`,s.id)}
 if(s.ptsUsed){m.lotes=[...lotesVig(m),{p:s.ptsUsed,v:addMonths(Date.now(),cfg.mesesVigencia)}];ptsMove(m,'devuelve',s.ptsUsed,`Anulación venta #${s.num}: puntos devueltos`,s.id)}
}

/* =========================================================
   APERTURA Y CIERRE DE CAJA
   ========================================================= */
function sessionTotals(s){
 const end=s.closedAt||Date.now();
 const sales=T('sales').filter(x=>x.status!=='anulada'&&x.at>=s.openedAt&&x.at<=end);
 const cash=sum(sales.filter(x=>x.method==='efectivo'),x=>x.total);
 const tr=sum(sales.filter(x=>x.method==='transferencia'),x=>x.total);
 const fi=sum(sales.filter(x=>x.method==='fiado'),x=>x.total);
 const df=sum(sales.filter(x=>x.method==='datafono'),x=>x.total);
 const mv=T('moves').filter(m=>m.method==='efectivo'&&m.at>=s.openedAt&&m.at<=end);
 const inC=sum(mv.filter(m=>m.type==='ingreso'),m=>m.amount),outC=sum(mv.filter(m=>m.type==='egreso'),m=>m.amount);
 const abonos=sum(T('ledger').filter(l=>l.type==='abono'&&l.cash&&l.at>=s.openedAt&&l.at<=end),l=>l.amount);
 return {count:sales.length,cash,tr,df,fi,inC:inC,outC,abonos,expected:s.base+cash+inC+abonos-outC};
}

   :`<div class="banner bad">${ic('alert')}<div class="grow">No encontramos filas con código y nombre. Revisa que la primera fila tenga los títulos de las columnas.</div></div>`;
  const b=$('#imp-go');if(b){b.disabled=!importRows.length;b.textContent=`Importar ${importRows.length} productos`}

function doImport(){

let fin={range:'mes',type:''};
function finRange(){const now=Date.now();if(fin.range==='hoy')return sod(now);if(fin.range==='7')return sod(now)-6*DAY;const d=new Date(now);d.setDate(1);return sod(d)}
function viewFinanzas(){

 const salesTot=sum(sales,s=>s.total),inM=sum(mv.filter(m=>m.type==='ingreso'),m=>m.amount)+sum(abonos,a=>a.amount),out=sum(mv.filter(m=>m.type==='egreso'),m=>m.amount);
 const inc=salesTot+inM,bal=inc-out;
 const cogs=sum(sales,s=>sum(s.items,i=>(i.cost||0)*i.qty));
 // filas: ventas agrupadas por día + movimientos
 const split=has('mesas')||sales.some(s=>s.mesa);const mesaTot=sum(sales.filter(s=>s.mesa),s=>s.total);
 const byDay={};sales.forEach(s=>{const o=split?(s.mesa?'m':'c'):'';const k=dkey(s.at)+o;byDay[k]=byDay[k]||{at:sod(s.at),o,amount:0,n:0};byDay[k].amount+=s.total;byDay[k].n++});
 let rows=[...Object.values(byDay).map(d=>({at:d.at+20*3600e3+(d.o==='m'?60e3:0),type:'ingreso',cat:'Ventas',concept:d.o==='m'?`Ventas en mesas del día (${d.n} pagos)`:d.o==='c'?`Ventas en caja del día (${d.n})`:`Ventas del día (${d.n})`,amount:d.amount,auto:true})),...mv,...abonos.map(a=>({at:a.at,type:'ingreso',cat:'Abono de fiado',concept:`${S.customers.find(c=>c.id===a.cid)?.name||''}`,amount:a.amount,auto:true}))];
 if(fin.type)rows=rows.filter(r=>r.type===fin.type);
 rows.sort((a,b)=>b.at-a.at);
 const byCat={};mv.filter(m=>m.type==='egreso').forEach(m=>byCat[m.cat]=(byCat[m.cat]||0)+m.amount);

  <div class="grid g4">
   <div class="card kpi"><span class="lbl">Ingresos</span><span class="val" style="color:var(--good)">${money(inc)}</span><span class="foot">${money(salesTot)} en ventas${mesaTot?` · ${money(mesaTot)} de mesas`:''}</span></div>
   <div class="card kpi"><span class="lbl">Egresos</span><span class="val" style="color:var(--bad)">${money(out)}</span><span class="foot">${mv.filter(m=>m.type==='egreso').length} registros</span></div>
   <div class="card kpi"><span class="lbl">Balance</span><span class="val" style="color:var(${bal>=0?'--good':'--bad'})">${money(bal)}</span><span class="foot">ingresos − egresos</span></div>
   <div class="card kpi"><span class="lbl">Utilidad bruta en ventas</span><span class="val">${money(salesTot-cogs)}</span><span class="foot">${salesTot?Math.round((salesTot-cogs)/salesTot*100):0}% de margen</span></div>
  </div>
  <div class="grid g-main">
   <div class="card"><h2>Movimientos ${sel('fin-type',[['','Todos'],['ingreso','Solo ingresos'],['egreso','Solo egresos']],fin.type,'data-c="fin-type" style="width:auto;font-weight:500"')}</h2>${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th class="r">Valor</th><th></th></tr></thead><tbody>${rows.slice(0,80).map(r=>`<tr><td style="white-space:nowrap">${fshort(r.at)}</td><td>${esc(r.concept)}${r.method&&!r.auto?` <span class="muted small">· ${esc(r.method)}</span>`:''}</td><td><span class="pill ${r.type==='ingreso'?'good':''}">${esc(r.cat)}</span></td><td class="r num" style="color:var(${r.type==='ingreso'?'--good':'--bad'})"><b>${r.type==='ingreso'?'+':'−'} ${money(r.amount)}</b></td><td class="r">${r.auto?'':`<button class="icon-btn" data-a="move-del" data-id="${r.id}" aria-label="Eliminar" style="color:var(--ink-3)">${ic('trash',15)}</button>`}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${ic('wallet',26)}No hay movimientos en este periodo.</div>`}</div>
   <div class="card"><h2>¿En qué se va el dinero?</h2>${cats.length?`<div class="hbars">${cats.map(([c,v])=>`<div class="hb"><span>${esc(c)}</span><b class="num">${money(v)}</b><div class="track"><div class="fill alt" style="width:${v/maxC*100}%"></div></div></div>`).join('')}</div>`:`<p class="muted small">Sin egresos en este periodo.</p>`}</div>
  </div>`;

let st={days:14};
function barChart(data,{h=220,fmt=money,alt=false}={}){
 const W=720,H=h,pl=58,pr=8,pt=12,pb=28;const max=Math.max(1,...data.map(d=>d.v));
 const step=niceStep(max/4);const top=Math.ceil(max/step)*step;const iw=W-pl-pr,ih=H-pt-pb;const bw=iw/data.length;
 let g='';for(let v=0;v<=top+1e-9;v+=step){const y=pt+ih-(v/top)*ih;g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="axis" x="${pl-8}" y="${y+4}" text-anchor="end">${shortMoney(v)}</text>`}
 const every=Math.ceil(data.length/10);
 const bars=data.map((d,i)=>{const bh=(d.v/top)*ih;const x=pl+i*bw+bw*.18;return`<rect class="bar ${alt?'alt':''}" x="${x}" y="${pt+ih-bh}" width="${bw*.64}" height="${Math.max(0,bh)}" rx="3"><title>${esc(d.l)}: ${fmt(d.v)}</title></rect>${i%every===0?`<text class="axis" x="${x+bw*.32}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`:''}`}).join('');
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg></div>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function shortMoney(v){if(v>=1e6)return'$'+(v/1e6).toFixed(v%1e6?1:0).replace('.',',')+' M';if(v>=1e3)return'$'+Math.round(v/1e3)+' mil';return'$'+v}
function viewStats(){
 const days=st.days,from=sod(Date.now())-(days-1)*DAY;
 const sales=okSales().filter(s=>s.at>=from);const tot=sum(sales,s=>s.total);
 const prevFrom=from-days*DAY;const prev=sum(okSales().filter(s=>s.at>=prevFrom&&s.at<from),s=>s.total);
 const daily=[];for(let i=0;i<days;i++){const d0=from+i*DAY;daily.push({l:fshort(d0),v:sum(sales.filter(s=>s.at>=d0&&s.at<d0+DAY),s=>s.total)})}
 const prod={};sales.forEach(s=>s.items.forEach(i=>{prod[i.pid]=prod[i.pid]||{name:i.name,q:0,v:0,u:0};prod[i.pid].q+=i.qty;prod[i.pid].v+=i.qty*i.price;prod[i.pid].u+=i.qty*(i.price-(i.cost||0))}));
 const top=Object.values(prod).sort((a,b)=>b.v-a.v).slice(0,6);const maxP=Math.max(1,...top.map(p=>p.v));
 const sel_={};sales.forEach(s=>{sel_[s.seller]=sel_[s.seller]||{v:0,n:0};sel_[s.seller].v+=s.total;sel_[s.seller].n++});
 const sellers=Object.entries(sel_).sort((a,b)=>b[1].v-a[1].v);const maxS=Math.max(1,...sellers.map(s=>s[1].v));
 const meth={efectivo:0,transferencia:0,datafono:0,fiado:0};sales.forEach(s=>meth[s.method]=(meth[s.method]||0)+s.total);
 const hours=Array.from({length:15},(_,i)=>({l:(6+i)+'h',v:0}));sales.forEach(s=>{const h=new Date(s.at).getHours()-6;if(hours[h])hours[h].v+=s.total});
 const util=sum(Object.values(prod),p=>p.u);
 const delta=prev?Math.round((tot-prev)/prev*100):0;
 const best=daily.reduce((a,b)=>b.v>a.v?b:a,{v:0,l:'—'});
 return `<div class="page-head"><div><h1>Estadísticas</h1><p>Cómo le está yendo a tu negocio</p></div><div class="seg">${[[7,'7 días'],[14,'14 días'],[30,'30 días']].map(([k,l])=>`<button class="${days===k?'on':''}" data-a="st-days" data-v="${k}">${l}</button>`).join('')}</div></div>
  <div class="grid g4">
   <div class="card kpi"><span class="lbl">Ventas</span><span class="val">${money(tot)}</span><span class="foot">${prev?`<span style="color:var(${delta>=0?'--good':'--bad'})">${delta>=0?'+':''}${delta}%</span> vs ${days} días anteriores`:'—'}</span></div>
   <div class="card kpi"><span class="lbl">Utilidad bruta</span><span class="val">${money(util)}</span><span class="foot">${tot?Math.round(util/tot*100):0}% de margen</span></div>
   <div class="card kpi"><span class="lbl">Número de ventas</span><span class="val">${num(sales.length)}</span><span class="foot">${money(sales.length?tot/sales.length:0)} promedio</span></div>
   <div class="card kpi"><span class="lbl">Mejor día</span><span class="val">${esc(best.l)}</span><span class="foot">${money(best.v)}</span></div>
  </div>
  <div class="card"><h2>Ventas por día</h2>${barChart(daily)}</div>
  <div class="grid g2">
   <div class="card"><h2>Productos estrella <span class="sub">por valor vendido</span></h2><div class="hbars">${top.map(p=>`<div class="hb"><span>${esc(p.name)} <span class="muted small">· ${num(p.q)} und</span></span><b class="num">${money(p.v)}</b><div class="track"><div class="fill" style="width:${p.v/maxP*100}%"></div></div></div>`).join('')||'<p class="muted small">Sin ventas</p>'}</div></div>
   <div class="card"><h2>Ventas por vendedor</h2><div class="hbars">${sellers.map(([id,s])=>`<div class="hb"><span>${esc(userName(id))} <span class="muted small">· ${s.n} ventas</span></span><b class="num">${money(s.v)}</b><div class="track"><div class="fill alt" style="width:${s.v/maxS*100}%"></div></div></div>`).join('')||'<p class="muted small">Sin ventas</p>'}</div></div>
   <div class="card"><h2>Horas con más ventas</h2>${barChart(hours,{h:200,alt:true})}</div>
   <div class="card"><h2>Métodos de pago</h2><div class="hbars">${[['Efectivo',meth.efectivo,''],['Transferencia',meth.transferencia,'alt'],['Datáfono',meth.datafono,''],['Fiado',meth.fiado,'']].filter(m=>!['Fiado','Datáfono'].includes(m[0])||m[1]).map(([l,v,c])=>`<div class="hb"><span>${l} <span class="muted small">· ${tot?Math.round(v/tot*100):0}%</span></span><b class="num">${money(v)}</b><div class="track"><div class="fill ${c}" style="width:${tot?v/tot*100:0}%"></div></div></div>`).join('')}</div></div>
  </div>`;
}

let pur=null;

function purMatches(){

 if(!q)return P.filter(p=>p.supplier===pur.sid).sort((a,b)=>(a.kind==='insumo'?0:1)-(b.kind==='insumo'?0:1)||a.name.localeCompare(b.name)).slice(0,8);

 else if(!pur.q)h=`<p class="muted small" style="margin:0">Busca el primer producto o insumo de la compra.</p>`;
 if(pur.q.trim())h+=`<div class="pur-new"><span class="small">¿No está? Créalo como insumo:</span><b class="small">${esc(pur.q.trim())}</b>${sel('pur-new-unit',UNITS,'kg','style="width:auto" aria-label="Unidad"')}<button type="button" class="btn sm" data-a="pur-create">${ic('plus',14)} Crear y agregar</button></div>`;
 return h;

const purTotal=()=>sum(pur.items,i=>(i.qty||0)*(i.cost||0));
function purItems(){
 if(!pur.items.length)return '';
 return `<div class="tbl-wrap"><table><thead><tr><th>Llegó</th><th class="r">Cantidad</th><th class="r">Costo por unidad</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>${pur.items.map((i,ix)=>{const p=S.products.find(x=>x.id===i.pid);return`<tr><td><b>${esc(p.name)}</b></td><td class="r"><div class="row" style="justify-content:flex-end;gap:6px;flex-wrap:nowrap"><input class="input num" style="width:84px" type="number" min="0" step="any" inputmode="decimal" value="${i.qty||''}" placeholder="0" data-i="pur-qty" data-ix="${ix}" aria-label="Cantidad de ${esc(p.name)}"><span class="muted small">${esc(p.unit||'und')}</span></div></td><td class="r"><div class="money-in" style="width:130px;margin-left:auto"><span>$</span><input class="input num" type="text" inputmode="numeric" autocomplete="off" data-money value="${i.cost?grp(i.cost):''}" data-i="pur-cost" data-ix="${ix}" aria-label="Costo de ${esc(p.name)}"></div></td><td class="r num" id="pur-sub-${ix}">${money((i.qty||0)*(i.cost||0))}</td><td class="r"><button type="button" class="icon-btn" data-a="pur-rm" data-ix="${ix}" aria-label="Quitar" style="color:var(--ink-3)">${ic('trash',15)}</button></td></tr>`}).join('')}</tbody></table></div>
 <div class="total-row"><span class="muted">Total de la compra</span><span class="big" id="pur-total">${money(purTotal())}</span></div>`;
}
function purRefresh(which){if(which!=='items'){const r=$('#pur-results');if(r)r.innerHTML=purResults()}if(which!=='results'){const it=$('#pur-items');if(it)it.innerHTML=purItems()}}
function purAdd(p){
 let ix=pur.items.findIndex(i=>i.pid===p.id);if(ix<0){pur.items.push({pid:p.id,qty:0,cost:p.cost});ix=pur.items.length-1}
 pur.q='';const q=$('#pur-q');if(q)q.value='';purRefresh();
 setTimeout(()=>document.querySelector(`[data-i="pur-qty"][data-ix="${ix}"]`)?.focus(),20);
}
function purSave(){
 const t=tenant();const sp=S.suppliers.find(x=>x.id===pur.sid);const items=pur.items.filter(i=>i.qty>0);
 if(!items.length){toast('Escribe la cantidad de al menos un producto','bad');return}
 const at=Date.now();const rec=[];
 items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);p.stock=Math.round((p.stock+i.qty)*100)/100;if(i.cost)p.cost=i.cost;p.supplier=sp.id;S.kardex.push({id:uid(),tid:t.id,pid:p.id,type:'entrada',qty:i.qty,at,note:`Compra a ${sp.name}`});rec.push({pid:p.id,name:p.name,qty:i.qty,unit:p.unit||'und',cost:i.cost||0})});
 const total=sum(rec,i=>i.qty*i.cost);
 S.purchases.push({id:uid(),tid:t.id,sid:sp.id,at,items:rec,total,method:pur.method});
 S.moves.push({id:uid(),tid:t.id,type:'egreso',cat:'Compra de mercancía',concept:`Compra a ${sp.name}`,amount:total,at,method:pur.method});
 liveEvent('compra',`Compra a ${sp.name} por ${money(total)}`);save();closeModal();render();toast(`Compra de ${money(total)} registrada · ${rec.length} producto${rec.length>1?'s':''}`);
}

  <div class="hint">${ic('info',15)} <b>Lo que siempre puede hacer un cajero:</b> vender en la caja (efectivo o transferencia), abrir y cerrar caja y ver solo sus propias ventas. Inventario, fiados y lo demás solo los ve si se lo activas. Lo demás lo activas con el botón <b>Permisos</b>.</div>

function aResumen(){
 const act=S.tenants.filter(t=>t.status==='activo');const mrr=sum(act,fee);
 const soon=S.tenants.filter(t=>!tenantLocked(t)&&daysUntil(t.due)<=7).sort((a,b)=>a.due-b.due);
 const susp=S.tenants.filter(t=>tenantLocked(t));
 const m0=new Date();m0.setDate(1);const paidMonth=sum(S.payments.filter(p=>p.at>=sod(m0)),p=>p.amount);
 const modCount=MODS.map(m=>({m,n:S.tenants.filter(t=>t.mods.includes(m.id)).length}));
 // ingresos de los últimos 6 meses
 const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const a=sod(d);const e=new Date(d);e.setMonth(e.getMonth()+1);months.push({l:d.toLocaleDateString('es-CO',{month:'short'}),v:sum(S.payments.filter(p=>p.at>=a&&p.at<sod(e)),p=>p.amount)})}

   <div class="card kpi"><span class="lbl">Cobrado este mes</span><span class="val">${money(paidMonth)}</span><span class="foot">pagos registrados</span></div>
   <div class="card kpi"><span class="lbl">Por vencer (7 días)</span><span class="val" style="color:var(${soon.length?'--warn':'--good'})">${soon.length}</span><span class="foot">${money(sum(soon,fee))} por cobrar</span></div>

  </div>

   <div class="card"><h2>Pagos recibidos <span class="sub">últimos 6 meses</span></h2>${barChart(months,{h:200})}</div>
   <div class="card"><h2>Atención hoy</h2><div class="stack">${[...soon,...susp].map(t=>`<div class="spread"><div style="min-width:0"><b class="small">${esc(t.name)}</b><div class="muted small">${money(fee(t))} · vence ${fshort(t.due)}</div></div><div class="row" style="gap:6px">${pillDue(t)}<button class="btn sm" data-a="tenant" data-id="${t.id}">Gestionar</button></div></div>`).join('')||'<p class="muted small">Todo al día.</p>'}</div></div>

}

function aActividad(){
 const now=Date.now(),today=sod(now);const rows=S.tenants.map(t=>({t,x:tenantLive(t)}));
 const onT=rows.filter(r=>r.x.online.length),onU=sum(rows,r=>r.x.online.length);
 const loginsToday=L0.feed.filter(e=>e.type==='login'&&e.at>=today).length;
 const salesToday=L0.feed.filter(e=>e.type==='venta'&&e.at>=today).map(e=>({total:e.amount||0}));
 const risk=rows.filter(r=>r.x.idle>=7&&r.t.status==='activo');
 const viewName=v=>NAV.find(n=>n.v===v)?.label||v;
 const agg={};rows.forEach(r=>r.x.views.forEach(([v,n])=>agg[v]=(agg[v]||0)+n));const aggL=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,8);const maxA=Math.max(1,...aggL.map(a=>a[1]));
 const status=r=>r.x.online.length?`<span class="pill good"><span class="live on"></span> En línea · ${r.x.online.map(u=>esc(u.name.split(' ')[0])).join(', ')}</span>`:tenantLocked(r.t)?pillDue(r.t):r.x.idle>=7?`<span class="pill bad">Sin uso ${r.x.idle} días · riesgo</span>`:r.x.idle>=3?`<span class="pill warn">Poco uso</span>`:`<span class="pill">Activo</span>`;
 const feedIcon={login:'logout',venta:'cart',compra:'truck',caja:'register',inventario:'box'};
 const feed=L0.feed.slice(-25).reverse();
 return `<div class="page-head"><div><h1>Actividad en vivo</h1><p>Quién está usando Natara ahora y qué módulos usa cada negocio. Se actualiza solo.</p></div></div>
  ${MODE==='real'?'':`<div class="banner info">${ic('info')}<div class="grow">En esta demo, “en vivo” funciona entre pestañas de este navegador: abre otra pestaña, entra como un negocio y míralo aparecer aquí. En la versión con Firebase verás a todos tus clientes desde cualquier dispositivo.</div></div>`}
  <div class="grid g4">
   <div class="card kpi"><span class="lbl">En línea ahora</span><span class="val" style="color:var(${onT.length?'--good':'--ink'})">${onT.length}</span><span class="foot">${onU} usuario${onU===1?'':'s'} conectado${onU===1?'':'s'}</span></div>
   <div class="card kpi"><span class="lbl">Ingresos de hoy</span><span class="val">${loginsToday}</span><span class="foot">inicios de sesión</span></div>
   <div class="card kpi"><span class="lbl">Ventas registradas hoy</span><span class="val">${num(salesToday.length)}</span><span class="foot">${money(sum(salesToday,s=>s.total))} en todos los negocios</span></div>
   <div class="card kpi"><span class="lbl">En riesgo</span><span class="val" style="color:var(${risk.length?'--bad':'--good'})">${risk.length}</span><span class="foot">activos sin usar la app 7+ días</span></div>
  </div>
  <div class="card"><h2>Uso por negocio</h2><div class="tbl-wrap"><table><thead><tr><th>Negocio</th><th>Estado</th><th>Último uso</th><th class="r">Ingresos 7 días</th><th class="r">Ventas hoy</th><th>Lo que más usa</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.t.name)}</b><div class="muted small">${esc(r.t.type)}</div></td><td>${status(r)}</td><td class="small">${r.x.lastAt?`${ago(r.x.lastAt)}<div class="muted">${esc(r.x.lastWho?.name||'')}</div>`:'Nunca'}</td><td class="r num">${r.x.logins7}</td><td class="r num">${r.x.salesToday.length} <span class="muted small">· ${money(sum(r.x.salesToday,s=>s.total))}</span></td><td><div class="chips">${r.x.views.slice(0,3).map(([v])=>`<span class="pill">${esc(viewName(v))}</span>`).join('')||'<span class="muted small">—</span>'}</div></td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g-main">
   <div class="card"><h2>Lo último que pasó</h2><div class="feed">${feed.map(e=>{const t=S.tenants.find(x=>x.id===e.tid);const u=S.users.find(x=>x.id===e.uid);return`<div class="feed-i"><span class="feed-ic">${ic(feedIcon[e.type]||'info',15)}</span><div style="min-width:0;flex:1"><div class="small"><b>${esc(u?.name||'')}</b> · ${esc(t?.name||'')}</div><div class="small muted">${esc(e.text)}</div></div><span class="small muted" style="white-space:nowrap">${ago(e.at)}</span></div>`}).join('')||'<p class="muted small">Sin actividad todavía.</p>'}</div></div>
   <div class="card"><h2>Módulos más usados</h2><div class="hbars">${aggL.map(([v,n])=>`<div class="hb"><span>${esc(viewName(v))}</span><b class="num">${num(n)} visitas</b><div class="track"><div class="fill" style="width:${n/maxA*100}%"></div></div></div>`).join('')}</div><p class="muted small" style="margin:12px 0 0">Te sirve para saber qué módulo ofrecer: si un cliente usa mucho la caja pero nunca estadísticas, muéstrale lo que se está perdiendo.</p></div>
  </div>`;
}

  const rec=JSON.parse(JSON.stringify(r));delete rec.pass;const j=stable(rec);if(RB.synced[k]===j)continue;

 if(RB.needVerify)return box('Verifica tu correo',`<p class="muted">Te enviamos un enlace a <b>${esc(RB.user?.email)}</b>. Ábrelo para confirmar que el correo es tuyo y luego vuelve aquí. Revisa también la carpeta de spam.</p><div class="row" style="justify-content:center"><button class="btn primary" data-a="verify-done">Ya lo verifiqué</button><button class="btn" data-a="verify-resend">Enviar de nuevo</button><button class="btn ghost" data-a="logout">Salir</button></div>`);
 if(RB.noProfile)return box('Este correo no tiene acceso a Natara',`<p class="muted">La cuenta <b>${esc(RB.user?.email)}</b> no está asociada a ningún negocio. Si crees que es un error, escríbenos a ${esc(ADMIN_EMAIL)}.</p><button class="btn" data-a="logout-ask">${ic('logout')} Cerrar sesión</button>`);
 if(RB.user&&!RB.profileReady)return box('Cargando tu cuenta…','<p class="muted">Un momento, por favor.</p>');
 const u=me();
 if(RB.user&&!u){RB.noProfile=true;return realGate()}
 // Espera a que llegue el negocio antes de pintar la app (si no, la pantalla de inicio falla)
 if(RB.user&&u&&u.tid&&!S.tenants.some(t=>t.id===u.tid)){if(RB.tenantReady){RB.noProfile=true;return realGate()}return box('Cargando tu negocio…','<p class="muted">Un momento, por favor.</p>')}
 if(RB.user&&u&&(u.active===false||u.archived)){lg.banner=['bad','Tu usuario fue desactivado. Habla con el dueño del negocio.'];rLogout();return box('Cerrando sesión…','')}
 return null;
}
async function rLogin(email,pass){
 const btn=$('#lg-submit');if(btn){btn.disabled=true;btn.textContent='Entrando…'}
 try{await FB.setPersistence(FB.auth,$('#lg-remember')?.checked?FB.browserLocalPersistence:FB.browserSessionPersistence);await FB.signInWithEmailAndPassword(FB.auth,email,pass);lg.fails[email]=0;lg.pass=''}
 catch(e){const c=e.code||'';
  if(c==='auth/too-many-requests'){lg.lockUntil=Date.now()+60000;lg.banner=['bad','Demasiados intentos fallidos. Por seguridad, espera 1 minuto antes de intentar de nuevo.']}
  else if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)){lg.fails[email]=(lg.fails[email]||0)+1;const left=5-lg.fails[email];
   if(left<=0){lg.lockUntil=Date.now()+60000;lg.fails[email]=0;lg.banner=['bad','Demasiados intentos fallidos. Por seguridad, espera 1 minuto antes de intentar de nuevo.']}
   else lg.banner=['bad',`Correo o contraseña incorrectos. Te quedan ${left} intento${left>1?'s':''}.${email===ADMIN_EMAIL?' <br><button type="button" class="linkish" data-a="admin-create">¿Es tu primera vez? Crear la cuenta de administradora con esta contraseña</button>':''}`]}
  else if(c==='auth/user-disabled')lg.banner=['bad','Tu usuario está desactivado. Habla con Samanat.'];
  else lg.banner=['bad',authErr(e)];
  if(email!==ADMIN_EMAIL)lg.pass='';render();$('#lg-pass')?.focus()}
}
async function rAdminCreate(){
 const pass=$('#lg-pass')?.value||lg.pass||'';const pe=passErrors(pass);
 if(pe.length){lg.email=ADMIN_EMAIL;lg.banner=['bad','Para crear tu cuenta, la contraseña necesita: '+pe.join(', ')+'.'];render();return}
 try{const c=await FB.createUserWithEmailAndPassword(FB.auth,ADMIN_EMAIL,pass);await FB.sendEmailVerification(c.user,{url:REAL_URL});lg.pass=''}
 catch(e){lg.banner=['bad',e.code==='auth/email-already-in-use'?'Esa cuenta ya existe. Si no recuerdas la contraseña, usa “¿Olvidaste tu contraseña?”.':authErr(e)];render()}
}
async function rForgot(email){
 try{await FB.sendPasswordResetEmail(FB.auth,email,{url:REAL_URL})}catch(e){if(e.code==='auth/network-request-failed'){lg.banner=['bad',authErr(e)];render();return}}
 lg.mode='form';lg.step=1;lg.email=email;lg.banner=['info',`Si <b>${esc(email)}</b> tiene una cuenta, te enviamos un enlace para crear una contraseña nueva. Revisa también la carpeta de spam.`];render();
}
async function rLogout(){const u=me();try{if(u?.tid)await FB.deleteDoc(FB.doc(FB.db,'presence',u.id))}catch(_){}navOpen=false;try{await FB.signOut(FB.auth)}catch(_){}}
async function rForceChange(np){
 try{await FB.updatePassword(FB.auth.currentUser,np);const u=me();delete u.mustChange;save();lg.err={};render();toast('Contraseña creada. ¡Bienvenido a Natara!')}
 catch(e){if(e.code==='auth/requires-recent-login'){lg.banner=['bad','Por seguridad, vuelve a iniciar sesión con la contraseña temporal y crea la nueva.'];rLogout()}else{lg.err={np:authErr(e)};render()}}
}
// Firebase no deja borrar cuentas de Authentication desde la app. Por eso, al eliminar un cliente,
// sus usuarios quedan "archivados" (sin negocio) y si vuelve con el mismo correo reutilizamos su cuenta.
const emailTaken=email=>S.users.some(x=>x.email.toLowerCase()===email&&!x.archived);
const DUP_AUTH='Ese correo ya tiene una cuenta en Firebase (de un cliente que borraste antes de esta actualización). Bórrala en <b>Firebase → Authentication → Usuarios</b>: busca el correo, toca los tres puntos y <b>Eliminar cuenta</b>. Luego vuelve a intentarlo.';
async function authFor(email,pass){
 const g=S.users.find(x=>x.archived&&x.email.toLowerCase()===email);
 if(g){S.users=S.users.filter(x=>x!==g);return {id:g.id,reused:true}}
 try{return {id:await createAuthUser(email,pass),reused:false}}catch(e){if(e.code==='auth/email-already-in-use')e.dup=true;throw e}
}
async function createAuthUser(email,pass){
 const sec=FB.initializeApp(window.NATARA_FB_CONFIG,'sec-'+Date.now());
 try{const a=FB.getAuth(sec);const c=await FB.createUserWithEmailAndPassword(a,email,pass);const id=c.user.uid;await FB.signOut(a);return id}finally{FB.deleteApp(sec).catch(()=>{})}
}
const busy=(form,txt)=>{const b=document.querySelector(`[data-form="${form}"]`);if(b){b.disabled=!!txt;if(txt){b.dataset.t=b.textContent;b.textContent=txt}else if(b.dataset.t)b.textContent=b.dataset.t}};
async function rEmpReset(u,react){try{await FB.sendPasswordResetEmail(FB.auth,u.email,{url:REAL_URL});closeModal();toast(`${react?u.name+' fue reactivado. ':''}Le enviamos a ${u.email} un enlace para crear su contraseña`)}catch(e){toast(authErr(e),'bad')}}
async function rEmpNew(d,t,email,err){
 busy('emp-form','Creando…');let id;try{id=await createAuthUser(email,d.pass)}catch(e){busy('emp-form');return err(authErr(e))}
 const nu={id,tid:t.id,name:d.name.trim(),email,role:'cajero',puesto:d.puesto==='mesero'?'mesero':'',active:true,perms:d.puesto==='mesero'&&d.cobra?['mesa_cobrar']:[],mustChange:true};S.users.push(nu);save();render();sendWelcome(t,nu,d.pass,true);
}
async function rTenantNew(d,email,er){
 busy('tn-form','Creando…');let pass=genTemp();let uidA,reused;try{({id:uidA,reused}=await authFor(email,pass))}catch(e){busy('tn-form');return er(e.dup?DUP_AUTH:authErr(e))}
 if(reused)pass=null;
 const id='t'+uid();const p=planById(d.plan);const due=new Date();due.setMonth(due.getMonth()+(Number(d.months)||1));
 const t={id,name:d.name.trim(),type:d.type,city:d.city,phone:fmtPhone(d.phone),plan:p.id,mods:[...p.mods,...(d.extra||[]).filter(m=>!p.mods.includes(m))],status:'activo',v2:true,due:sod(due),since:sod(Date.now())};S.tenants.push(t);
 const u={id:uidA,tid:id,name:d.owner.trim(),role:'dueno',email,mustChange:!reused,perms:[],active:true};S.users.push(u);
 if(d.amount){S.payments.push({id:uid(),tid:id,amount:d.amount,at:Date.now(),method:'Bre-B',concept:d.concept||'Compra desde la demo',ref:d.ref||''});if(d.setup)t.setupPaid=true}else{S.payments.push({id:uid(),tid:id,amount:p.price,at:Date.now(),method:'Transferencia',concept:'Mensualidad'});if(d.setup){t.setupPaid=true;S.payments.push({id:uid(),tid:id,amount:SETUP.price,at:Date.now(),method:'Transferencia',concept:'Implementación asistida'})}}
 S.messages.push({id:uid(),to:id,kind:'aviso',title:`Bienvenido a Natara, ${u.name.split(' ')[0]}`,body:'Tu cuenta está lista. Empieza cargando tu inventario desde Excel o creando tus productos.',at:Date.now(),readBy:[]});
 if(d.orderId){const o=S.orders.find(x=>x.id===d.orderId);if(o){o.status='aprobada';o.tid=id;o.doneAt=Date.now()}}
 save();render();
 if(reused)FB.sendPasswordResetEmail(FB.auth,email,{url:REAL_URL}).catch(e=>console.warn('reset',e));
 sendWelcome(t,u,pass);
}
async function rTenantSave(d,f,tt,o,email,er){
 busy('tenant-form','Guardando…');let pass=genTemp();let nid,reused;try{({id:nid,reused}=await authFor(email,pass))}catch(e){busy('tenant-form');return er(e.dup?DUP_AUTH:authErr(e))}if(reused)pass=null;
 tt.name=d.tname.trim();tt.type=d.ttype.trim();tt.city=d.tcity.trim();tt.phone=fmtPhone(d.tphone);tt.plan=d.plan;tt.mods=[...f.querySelectorAll('input[name=mod]:checked')].map(c=>c.value);tt.due=new Date(d.due+'T12:00:00').getTime();
 const nu={...JSON.parse(JSON.stringify(o)),id:nid,name:d.oname.trim(),email,mustChange:!reused,active:true};delete nu.pass;delete nu.archived;
 o.archived=true;o.active=false;S.users.push(nu);save();render();if(reused)FB.sendPasswordResetEmail(FB.auth,email,{url:REAL_URL}).catch(()=>{});sendWelcome(tt,nu,pass);
}
async function rResend(tid){const u=S.users.find(x=>x.tid===tid&&x.role==='dueno'&&!x.archived);if(!u)return;try{await FB.sendPasswordResetEmail(FB.auth,u.email,{url:REAL_URL});closeModal();toast(`Le enviamos a ${u.email} un enlace para crear una contraseña nueva`)}catch(e){toast(authErr(e),'bad')}}
async function rPurge(tid,uids){
 const {db,collection,getDocs,writeBatch,doc,query,where}=FB;
 try{for(const c of TCOLLS){const sn=await getDocs(collection(db,'tenants',tid,c));for(let i=0;i<sn.docs.length;i+=400){const b=writeBatch(db);sn.docs.slice(i,i+400).forEach(x=>b.delete(x.ref));await b.commit()}}
  const ac=await getDocs(query(collection(db,'activity'),where('tid','==',tid)));for(let i=0;i<ac.docs.length;i+=400){const b=writeBatch(db);ac.docs.slice(i,i+400).forEach(x=>b.delete(x.ref));await b.commit()}
  const b=writeBatch(db);b.delete(doc(db,'stats',tid));uids.forEach(u=>b.delete(doc(db,'presence',u)));await b.commit();
 }catch(e){console.error('purge',e);toast('No se pudieron borrar todos los datos del cliente. Intenta de nuevo.','bad')}
}
function rLive(u,type,text,v,amount){
 const {db,doc,setDoc,addDoc,collection,increment}=FB;if(!RB.profileReady)return;
 if(type!=='view')addDoc(collection(db,'activity'),{tid:u.tid,uid:u.id,type,text:text||'',amount:amount||0,at:Date.now()}).catch(e=>console.warn('activity',e.code));
 if(v)setDoc(doc(db,'stats',u.tid),{views:{[v]:increment(1)}},{merge:true}).catch(e=>console.warn('stats',e.code));
 rBeat(u,true);
}
function rBeat(u,force){if(!RB.profileReady)return;if(!force&&Date.now()-RB.lastBeat<150000)return;RB.lastBeat=Date.now();FB.setDoc(FB.doc(FB.db,'presence',u.id),{tid:u.tid,at:Date.now()}).catch(e=>console.warn('presence',e.code))}
if(REAL){const go=()=>fbBoot();if(window.FB)go();else window.addEventListener('fb-ready',go,{once:true})}

setInterval(()=>{const u=me();if(u&&u.tid&&isLocked()&&!document.querySelector('.lock-card'))render()},60000);
render();
